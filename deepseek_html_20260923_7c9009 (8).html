let scanStream = null, scanRAF = null, scanDetector = null, scanning = false;
let zxingReader = null, scanCanvas = null, scanCtx = null, lastDecodeTime = 0;
async function startScan(){
  if(scanning) return;
  if(UI.tab !== 'scan') return;
  const video = $('#scanVideo');
  const statusEl = $('#scanStatus');
  const frameEl = $('#scanFrame');
  const tipEl = $('#scanTip');
  if(!video) return;
  const isSecure = window.isSecureContext === true;
  if(!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function'){
    if(statusEl) statusEl.innerHTML = '<span style="color:var(--warn);font-weight:600">'+T('cam_unsupported')+'</span>';
    if(tipEl) tipEl.textContent = T('cam_unsupported');
    return;
  }
  if(!isSecure){
    if(statusEl) statusEl.innerHTML = '<span style="color:var(--warn);font-weight:600">'+T('cam_need_https')+'</span>';
    if(tipEl) tipEl.textContent = '';
    if(frameEl) frameEl.style.display = 'none';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
  }catch(e){
    if(statusEl) statusEl.textContent = T('cam_denied');
    if(tipEl) tipEl.textContent = '';
    return;
  }
  video.srcObject = scanStream;
  try{ await video.play(); }catch(e){}
  await new Promise(res => {
    if(video.readyState >= 2 && video.videoWidth > 0) return res();
    const t = setTimeout(res, 2000);
    const done = ()=>{ clearTimeout(t); res(); };
    video.onloadedmetadata = done;
    video.oncanplay = done;
  });
  if(frameEl) frameEl.style.display = 'block';
  scanning = true;
  if(statusEl) statusEl.textContent = T('scanning');
  if(tipEl) tipEl.textContent = T('scan_hint');
  scanDetector = null;
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  if('BarcodeDetector' in window){
    try{
      const fmts = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code','codabar'];
      const use = want.filter(f=>fmts.indexOf(f)>=0);
      scanDetector = use.length ? new BarcodeDetector({formats:use}) : new BarcodeDetector();
    }catch(e){ scanDetector = null; }
  }
  if(!scanDetector && typeof ZXing !== 'undefined'){
    try{
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODABAR
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      zxingReader = new ZXing.BrowserMultiFormatReader(hints);
    }catch(e){ zxingReader = null; }
  }
  if(!scanDetector && !zxingReader){
    if(statusEl) statusEl.textContent = T('scanner_unavailable');
    return;
  }
  scanCanvas = document.createElement('canvas');
  scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
  lastDecodeTime = 0;
  const tick = async () => {
    if(!scanning) return;
    if(!video.isConnected){ scanning = false; return; }
    if(video.readyState < 2 || !video.videoWidth){ scanRAF = requestAnimationFrame(tick); return; }
    if(scanDetector){
      try{
        const codes = await scanDetector.detect(video);
        if(codes && codes.length && codes[0].rawValue){ onScanned(String(codes[0].rawValue)); return; }
      }catch(e){}
    }
    if(zxingReader){
      const now = performance.now();
      if(now - lastDecodeTime > 200){
        lastDecodeTime = now;
        if(scanCanvas.width !== video.videoWidth){
          scanCanvas.width = video.videoWidth;
          scanCanvas.height = video.videoHeight;
        }
        try{
          scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
          const r = zxingReader.decodeFromCanvas(scanCanvas);
          if(r){ const txt = r.getText(); if(txt){ onScanned(txt); return; } }
        }catch(e){}
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  tick();
}
function stopScan(){
  scanning = false;
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream = null; }
  const v = $('#scanVideo'); if(v) v.srcObject = null;
  scanCanvas = null; scanCtx = null; lastDecodeTime = 0;
}
function detectBarcodeInfo(code){
  const digits = String(code).replace(/\D/g, '');
  const info = { type:'', region:'' };
  if(digits.length === 13) info.type = 'EAN-13';
  else if(digits.length === 12) info.type = 'UPC-A';
  else if(digits.length === 8) info.type = 'EAN-8';
  else if(digits.length > 0) info.type = '数字条码';
  else info.type = '其他';
  if(digits.length >= 3){
    const p = parseInt(digits.slice(0,3), 10);
    if(p >= 690 && p <= 699) info.region = '中国大陆';
    else if(p >= 0 && p <= 139) info.region = '美国/加拿大';
    else if(p >= 300 && p <= 379) info.region = '法国';
    else if(p >= 400 && p <= 440) info.region = '德国';
    else if(p >= 450 && p <= 459) info.region = '日本';
    else if(p === 471) info.region = '中国台湾';
    else if(p === 489) info.region = '中国香港';
    else if(p === 958) info.region = '中国澳门';
    else if(p === 880) info.region = '韩国';
    else if(p === 93) info.region = '澳大利亚';
    else if(p === 94) info.region = '新西兰';
    else if(p === 955) info.region = '马来西亚';
  }
  return info;
}
async function lookupNetwork(code){
  const sources = [
    { name:'Open Food Facts',     url:'https://world.openfoodfacts.org/api/v2/product/' },
    { name:'Open Beauty Facts',   url:'https://world.openbeautyfacts.org/api/v2/product/' },
    { name:'Open Products Facts', url:'https://world.openproductsfacts.org/api/v2/product/' }
  ];
  const fields = 'product_name,product_name_zh,generic_name,brands,categories_tags,quantity';
  for(const src of sources){
    try{
      const ctrl = new AbortController();
      const tm = setTimeout(()=>ctrl.abort(), 4000);
      const url = src.url + encodeURIComponent(code) + '.json?fields=' + fields;
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tm);
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.status === 1 && j.product){
        const p = j.product;
        const name = String(p.product_name_zh || p.product_name || p.generic_name || '').trim();
        const brand = String(p.brands || '').split(',')[0].trim();
        const qty = String(p.quantity || '').trim();
        const tags = (p.categories_tags||[]).join(' ').toLowerCase();
        let catId = '';
        if(/snack|biscuit|chocolate|candy|chip|crisp/.test(tags)) catId = 'c_food_snack';
        else if(/beverage|drink|water|juice|soda|coffee|tea/.test(tags)) catId = 'c_food_drink';
        else if(/condiment|sauce|spice|oil|vinegar/.test(tags)) catId = 'c_food_season';
        else if(/dairy|milk|yogurt|cheese/.test(tags)) catId = 'c_fresh_dairy';
        else if(/frozen/.test(tags)) catId = 'c_fresh_cold';
        else if(/canned/.test(tags)) catId = 'c_food_can';
        else if(/cosmetic|beauty|shampoo|skin|lotion/.test(tags)) catId = 'c_beauty_skin';
        else if(/food/.test(tags)) catId = 'c_food';
        if(name || brand){
          const notes = ['【联网查询】','条码：'+code];
          if(brand) notes.push('品牌：'+brand);
          if(qty) notes.push('规格：'+qty);
          notes.push('来源：'+src.name);
          return { name, brand, qty, catId, note: notes.join('\n') };
        }
      }
    }catch(e){}
  }
  return null;
}
async function onScanned(code){
  if(!code) return;
  stopScan();
  if(navigator.vibrate){ try{ navigator.vibrate(55); }catch(e){} }
  S.stats.totalScan = (S.stats.totalScan||0) + 1;
  const localInfo = detectBarcodeInfo(code);
  const prefill = { barcode: code };
  const cached = S.barcodeCache && S.barcodeCache[code];
  if(cached && cached.name){
    prefill.name = cached.name;
    prefill.catId = cached.catId || '';
    prefill.unit = cached.unit || '';
    prefill.price = cached.price || '';
    prefill._hit = 'local';
    toast('✓ ' + T('local_hit') + '：' + cached.name);
  }else{
    let netResult = null;
    if(S.settings.enableNet){
      toast('联网查询中…', 3500);
      netResult = await lookupNetwork(code);
    }
    if(netResult){
      prefill.name = netResult.name;
      prefill.catId = netResult.catId;
      prefill.unit = netResult.qty;
      prefill.note = netResult.note;
      prefill._hit = 'network';
      toast('✓ ' + T('network_hit'));
    }else{
      const notes = ['【扫码录入】','条码：' + code];
      if(localInfo.type) notes.push('类型：' + localInfo.type);
      if(localInfo.region) notes.push('地区：' + localInfo.region);
      notes.push('提示：这是第一次扫此条码，填写后会自动记住，下次秒填。');
      prefill.note = notes.join('\n');
      toast(T('scan_new') + '：' + code);
    }
  }
  save(); checkAchievements();
  UI.tab = 'items';
  render();
  itemFormSheet(null, prefill);
}
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}
async function callGeminiVision(apiKey, imageDataUrl){
  const base64 = imageDataUrl.split(',')[1];
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=' + encodeURIComponent(apiKey);
  const prompt = '这是一张物品的照片。请识别这是什么物品，并返回严格 JSON（不要任何其他文字、不要 markdown 代码块）：' +
    '{"name":"物品的中文名称（尽量包含品牌名）","category":"从这些里选一个最接近的：食品/生鲜/药品/日化/美妆/厨具/数码/服饰/文具/家居/母婴/文件/安全/其他","shelfLifeDays":数字(保质期天数，不确定填0),"warrantyDays":数字(保修期天数，不确定填0),"note":"一句话描述"}';
  const body = {
    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: base64 } }] }],
    generationConfig: { temperature: 0.2, maxOutputTokens: 300 }
  };
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if(!r.ok){ const txt = await r.text(); throw new Error('HTTP ' + r.status + ' ' + txt.slice(0, 120)); }
  const j = await r.json();
  const text = j.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const m = text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('no json');
  return JSON.parse(m[0]);
}
function mapCategoryToId(catName){
  if(!catName) return '';
  const s = String(catName);
  if(/食品|零食/.test(s)) return 'c_food_snack';
  if(/生鲜/.test(s)) return 'c_fresh';

async function runAiRecognition(dataUrl){

let suppressClick = false;
document.addEventListener('pointerdown', e=>{
  if(UI.tab !== 'zones' || UI.organizeMode) return;
  if(e.button !== undefined && e.button !== 0) return;
  const itemEl = e.target.closest('.item[data-act="openItem"]');
  if(!itemEl) return;
  itemEl.style.touchAction = 'none';
  itemEl.style.webkitUserSelect = 'none';
  itemEl.style.userSelect = 'none';
  const itemId = itemEl.dataset.id;
  const startX = e.clientX, startY = e.clientY;
  const pointerId = e.pointerId;
  const startRect = itemEl.getBoundingClientRect();
  let longPressed = false;
  let ghost = null;
  let currentDrop = null;
  let holdTimer = null;
  const cleanup = ()=>{
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUpHandler);
    document.removeEventListener('pointercancel', onCancelHandler);
    if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    if(currentDrop) currentDrop.classList.remove('drop-hover');
    itemEl.classList.remove('dragging');
    itemEl.style.touchAction = '';
    itemEl.style.webkitUserSelect = '';
    itemEl.style.userSelect = '';
    ghost = null; currentDrop = null;
  };
  const onMove = (ev)=>{
    if(ev.pointerId !== pointerId) return;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if(!longPressed){
      if(Math.abs(dx) > 15 || Math.abs(dy) > 15) cleanup();
      return;
    }
    ev.preventDefault();
    if(ghost){ ghost.style.left = (startRect.left + dx) + 'px'; ghost.style.top = (startRect.top + dy) + 'px'; }
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const dropEl = el && el.closest ? el.closest('[data-drop-loc]') : null;
    if(dropEl !== currentDrop){
      if(currentDrop) currentDrop.classList.remove('drop-hover');
      if(dropEl) dropEl.classList.add('drop-hover');
      currentDrop = dropEl;
    }
  };
  const handleUp = (ev, cancelled)=>{
    if(ev.pointerId !== pointerId) return;
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(longPressed && !cancelled){
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; }, 500);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const dropEl = el && el.closest ? el.closest('[data-drop-loc]') : null;
      if(dropEl){
        const newLocId = dropEl.getAttribute('data-drop-loc') || '';
        const it = S.items.find(i=>i.id === itemId);
        if(it && it.locId !== newLocId){
          it.locId = newLocId;
          it.lastUsedAt = Date.now();
          it.lastPutAt = Date.now();  // 记录放回
          S.stats.totalDragMoved = (S.stats.totalDragMoved||0) + 1;
          save(); markRecorded();
          const name = newLocId ? getLocFullPath(newLocId) : T('unloc');
          toast(T('drag_moved', {n: name}), 2200);
          if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(e){} }
          checkAchievements();
          cleanup();
          render({noScroll:true});
          return;
        }
      }
    }
    cleanup();
  };
  const onUpHandler = (ev)=>{ handleUp(ev, false); };
  const onCancelHandler = (ev)=>{ handleUp(ev, true); };
  holdTimer = setTimeout(()=>{
    longPressed = true;
    if(navigator.vibrate){ try{ navigator.vibrate(35); }catch(e){} }
    ghost = itemEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.cssText += `position:fixed;left:${startRect.left}px;top:${startRect.top}px;width:${startRect.width}px;height:${startRect.height}px;pointer-events:none;z-index:9999;`;
    document.body.appendChild(ghost);
    itemEl.classList.add('dragging');
  }, 350);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUpHandler);
  document.addEventListener('pointercancel', onCancelHandler);
});

function escapeCsv(s){
  s = String(s==null?'':s);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function parseCSV(text){
  const rows = [];
  let cur = [], field = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ cur.push(field); field = ''; }
      else if(c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
      else if(c === '\r'){}
      else field += c;
    }
  }
  if(field || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(f => f !== ''));
}
function importCSV(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('bad csv');
  const headers = rows[0];
  const idx = {};
  headers.forEach((h, i) => idx[h.trim()] = i);
  const getCol = (row, name) => { const i = idx[name]; return i !== undefined ? (row[i]||'') : ''; };
  const newItems = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    const name = getCol(r, '名称');
    if(!name) continue;
    const catName = getCol(r, '分类');
    const cat = S.categories.find(c => nm(c) === catName);
    const locPath = getCol(r, '存放位置');
    let locId = '';
    if(locPath){
      const parts = locPath.split('→').map(s=>s.trim());
      const tree = locTree();
      for(const top of tree){
        if(nm(top) === parts[0]){
          if(parts[1]){ const sub = top.children.find(c => nm(c) === parts[1]); if(sub) locId = sub.id; }
          else locId = top.id;
          break;
        }
      }
    }
    newItems.push({
      id: uid('i_'), createdAt: Date.now(), lastUsedAt: Date.now(),
      name, catId: cat ? cat.id : '', locId,
      qty: parseFloat(getCol(r,'数量')) || 1,
      unit: getCol(r,'单位'),
      price: parseFloat(getCol(r,'单价')) || 0,
      purchaseDate: getCol(r,'购买日期'),
      prodDate: getCol(r,'生产日期'),
      expDate: getCol(r,'过期日期'),
      opened: getCol(r,'开封') === '是',
      openedDate: getCol(r,'开封日期'),
      afterOpenShelf: parseInt(getCol(r,'开封后保质期(天)')) || 0,
      warrantyUntil: getCol(r,'保修截止日'),
      minQty: parseFloat(getCol(r,'低库存阈值')) || 0,
      note: getCol(r,'备注'),
      barcode: getCol(r,'条码')
    });
  }
  return newItems;
}

      else { txt.textContent = T('unloc'); txt.classList.add('empty'); }
    }
    document.querySelectorAll('.loc-chip').forEach(c=>{ c.classList.toggle('on', (c.dataset.locId || '') === id); });
    const panel = document.getElementById('locPanel');
    if(panel) panel.classList.add('hidden');
    const picker = document.querySelector('.loc-picker');
    if(picker) picker.classList.remove('open');
    return;
  }
  if(act==='openLayoutManage'){ layoutManageSheet(false); return; }
  if(act==='pickHouse'){
    const key = el.dataset.key;
    if(HOUSE_TEMPLATES[key]){
      applyHouseTemplate(key);
      closeSheet(); toast(T('layout_added'));
      render({noScroll:true});
      setTimeout(()=>layoutManageSheet(false), 200);
    }
    return;
  }
  if(act==='toggleFloor'){
    const id = el.dataset.id;
    UI.layoutExpanded[id] = !UI.layoutExpanded[id];
    layoutManageSheet(true);
    return;
  }
  if(act==='addFloor'){
    const n = prompt(T('layout_floor_name'), '');
    if(n && n.trim()){
      S.locations.push({ id:uid('l_f_'), name:{zh:n.trim(),en:n.trim()}, parentId:null, isOther:false, order:S.locations.filter(l=>!l.parentId).length });
      const newTop = S.locations[S.locations.length-1];
      S.locations.push({ id:uid('l_o_'), name:{zh:'其他',en:'Other'}, parentId:newTop.id, isOther:true, order:999 });
      S.stats.customLocCreated = 1;
      save(); checkAchievements(); layoutManageSheet(true);
    }
    return;
  }
  if(act==='renameFloor'){
    const id = el.dataset.id; const loc = locOf(id); if(!loc) return;
    const n = prompt(T('layout_floor_name'), nm(loc));
    if(n && n.trim()){ loc.name = { zh:n.trim(), en:n.trim() }; S.stats.customLocCreated = 1; save(); checkAchievements(); layoutManageSheet(true); }
    return;
  }
  if(act==='delFloor'){
    const id = el.dataset.id;
    customConfirm('删除房间', T('layout_delete_floor'), ()=>{
      const kids = S.locations.filter(l => l.parentId === id).map(l => l.id);
      S.items.forEach(i=>{ if(i.locId === id || kids.indexOf(i.locId) >= 0) i.locId = ''; });
      S.locations = S.locations.filter(l => l.id !== id && l.parentId !== id);
      save(); layoutManageSheet(true); render();
    }, { danger:true, okText:'删除' });
    return;
  }
  if(act==='addRoom'){
    const pid = el.dataset.id;
    const n = prompt(T('layout_room_name'), '');
    if(n && n.trim()){
      S.locations.push({ id:uid('l_r_'), name:{zh:n.trim(),en:n.trim()}, parentId:pid, isOther:false, order:99 });
      S.stats.customLocCreated = 1;
      save(); checkAchievements(); layoutManageSheet(true);
    }
    return;
  }
  if(act==='renameRoom'){
    const id = el.dataset.id; const loc = locOf(id); if(!loc) return;
    const n = prompt(T('layout_room_name'), nm(loc));
    if(n && n.trim()){ loc.name = { zh:n.trim(), en:n.trim() }; S.stats.customLocCreated = 1; save(); checkAchievements(); layoutManageSheet(true); }
    return;
  }
  if(act==='delRoom'){
    const id = el.dataset.id; const loc = locOf(id);
    if(!loc) return;
    if(loc.isOther){ toast(T('layout_other_locked')); return; }
    customConfirm('删除储物位', T('layout_delete_room'), ()=>{
      S.items.forEach(i=>{ if(i.locId === id) i.locId = ''; });
      S.locations = S.locations.filter(l => l.id !== id);
      save(); layoutManageSheet(true); render();
    }, { danger:true, okText:'删除' });
    return;
  }
  if(act==='resetLayout'){
    customConfirm('重新选择户型', T('layout_reset_confirm'), ()=>{
      S.settings.layoutOnboarded = false;
      save();
      layoutOnboardSheet();
    }, { danger:true, okText:'重新选择' });
    return;
  }
  if(act==='setColor'){
    const newColor = el.dataset.c;
    if(newColor && /^#[0-9a-fA-F]{6}$/.test(newColor)){
      S.settings.themeColor = newColor;
      applyTheme(); save(); render({noScroll:true});
    }
    return;
  }
  if(act==='toggleDark'){ S.settings.dark = !S.settings.dark; applyTheme(); save(); render({noScroll:true}); return; }
  if(act==='toggleNet'){ S.settings.enableNet = !S.settings.enableNet; save(); render({noScroll:true}); return; }
  if(act==='setLang'){ S.settings.lang = el.dataset.l; save(); render({noScroll:true}); return; }
  if(act==='clearCache'){
    customConfirm('清空本机条码库', T('clear_cache_confirm'), ()=>{
      S.barcodeCache = {}; save(); render({noScroll:true}); toast(T('clear_cache_done'));
    }, { danger:true, okText:'清空' });
    return;
  }
  if(act==='openItem'){
    if(UI.organizeMode) return;
    itemDetailSheet(el.dataset.id); return;
  }
  if(act==='editItem'){ const it = S.items.find(i=>i.id===el.dataset.id); closeSheet(); setTimeout(()=>itemFormSheet(it),120); return; }
  if(act==='saveItem'){ saveItemForm(el.dataset.id); return; }
  if(act==='delItem'){
    const it = S.items.find(i=>i.id===el.dataset.id);
    if(!it) return;
    const wasExpired = expStatus(it) === 'expired';
    const name = it.name;
    customConfirm('删除物品', T('del_confirm') + '\n\n「' + name + '」', ()=>{
      S.items = S.items.filter(i=>i.id!==el.dataset.id);
      if(wasExpired){
        S.stats.totalDiscardExpired = (S.stats.totalDiscardExpired||0) + 1;
        markRecorded(); closeSheet(); save();
        toast(T('field_clean_done',{n:name}), 2600);
        if(S.items.length === 0){ S.stats.emptiedAll = 1; }
        checkAchievements(); render();
        return;
      }
      if(S.items.length === 0){ S.stats.emptiedAll = 1; }
      markRecorded(); save(); closeSheet(); toast(T('deleted')); checkAchievements(); render();
    }, { danger:true, okText:'删除' });
    return;
  }
  if(act==='manualSubmit'){
    const v = ($('#manualCode')||{}).value || '';
    if(!v.trim()) return;
    $('#manualCode').value = '';
    onScanned(v.trim());
    return;
  }
  if(act==='openCatManage'){ catManageSheet(); return; }
  if(act==='addCat'){
    const n = prompt(T('add_cat'), '');
    if(n && n.trim()){
      S.categories.push({ id:uid('c_'), name:{zh:n.trim(),en:n.trim()}, icon:'c_other', parentId:null, order:S.categories.length });
      S.stats.customCatCreated = 1;
      save(); checkAchievements(); catManageSheet();
    }
    return;
  }
  if(act==='addSubCat'){
    const pid = el.dataset.id;
    const n = prompt(T('add_sub'), '');
    if(n && n.trim()){
      S.categories.push({ id:uid('c_'), name:{zh:n.trim(),en:n.trim()}, icon:'c_other', parentId:pid, order:99 });
      S.stats.customCatCreated = 1;
      save(); checkAchievements(); catManageSheet();
    }
    return;
  }
  if(act==='renameCat'){
    const c = catOf(el.dataset.id); if(!c) return;
    const n = prompt(T('cat_name'), nm(c));
    if(n && n.trim()){ c.name = { zh:n.trim(), en:n.trim() }; save(); catManageSheet(); }
    return;
  }
  if(act==='delCat'){
    const id = el.dataset.id;
    const kids = S.categories.filter(c=>c.parentId===id);
    if(kids.length){ alert('请先删除子分类'); return; }
    const cnt = S.items.filter(i=>i.catId===id).length;
    customConfirm('删除分类', T('del')+'「'+nm(catOf(id))+'」？'+(cnt?'\n\n'+T('item_count',{n:cnt})+' → '+T('uncat'):''), ()=>{
      S.items.forEach(i=>{ if(i.catId===id) i.catId=''; });
      S.categories = S.categories.filter(c=>c.id!==id);
      save(); catManageSheet(); render();
    }, { danger:true, okText:'删除' });
    return;
  }
  if(act==='copyShareLink'){
    const url = location.origin + location.pathname + '#share';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>{
        toast(T('share_copied'), 2000);
      }).catch(()=>{
        prompt('复制下面的链接：', url);
      });
    } else {
      prompt('复制下面的链接：', url);
    }
    return;
  }
  if(act==='exportCsv'){ exportCSV(); return; }
  if(act==='exportJson'){ exportJSON(); return; }
  if(act==='importData'){ $('#fileInput').click(); return; }
  if(act==='clearData'){
    customConfirm(T('clear_title'), T('clear_msg'), ()=>{
      Store.removeItem(LS_KEY);
      S = defaultData();
      save(); render(); toast(T('deleted'));
    }, { danger:true, okText:'清空数据' });
    return;
  }
});
document.addEventListener('change', e=>{
  if(e.target.type==='color'){ S.settings.themeColor = e.target.value; applyTheme(); save(); render({noScroll:true}); return; }
  if(e.target.id==='remindTime'){ S.settings.remindTime = e.target.value || '22:00'; save(); return; }
  /* 周报切换 */
  if(e.target.dataset && e.target.dataset.act === 'changeReportWeek'){
    UI.reportWeek = parseInt(e.target.value, 10) || 0;
    const v = $('#view');
    if(UI.tab === 'home') v.innerHTML = viewHome();
    else if(UI.tab === 'stats') v.innerHTML = viewStats();
    return;
  }
  if(e.target.id==='fileInput' && e.target.files && e.target.files[0]){
    const f = e.target.files[0];
    const fr = new FileReader();
    const isCsv = /\.csv$/i.test(f.name);
    if(isCsv){
      fr.onload = ()=>{
        try{
          const items = importCSV(fr.result);
          if(!items.length) throw new Error('empty');
          items.forEach(it => S.items.push(it));
          S.stats.totalAdded = (S.stats.totalAdded||0) + items.length;
          save(); render();
          toast(T('import_csv_ok',{n:items.length}), 2600);
        }catch(err){ console.warn(err); toast(T('import_fail_hint')); }
        e.target.value = '';
      };
      fr.readAsText(f);
    } else {
      fr.onload = ()=>{
        try{
          const data = JSON.parse(fr.result);
          if(!data || !Array.isArray(data.items)) throw new Error('bad');
          S = Object.assign(defaultData(), data);
          S.settings = Object.assign(defaultData().settings, data.settings||{});
          S.stats = Object.assign(defaultData().stats, data.stats || {});
          if(!S.barcodeCache) S.barcodeCache = {};
          if(!S.achievements || typeof S.achievements !== 'object') S.achievements = {};
          ensureDefaultCats();
          ensureAllOthers();
          save(); render(); toast(T('import_ok'));
        }catch(err){ toast(T('import_fail_hint')); }
        e.target.value = '';
      };
      fr.readAsText(f);
    }
  }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.type==='color'){ S.settings.themeColor = el.value; applyTheme(); return; }
  if(el.id==='warnDays'){ S.settings.warnDays = Math.max(0, Math.min(365, parseInt(el.value,10)||0)); save(); return; }
  if(el.id==='warrantyWarnDays'){ S.settings.warrantyWarnDays = Math.max(0, Math.min(365, parseInt(el.value,10)||0)); save(); return; }
  if(el.id==='remindTime'){ S.settings.remindTime = el.value || '22:00'; save(); return; }
  if(el.id==='zoneQ'){ UI.zoneSearch = el.value; const v = $('#view'); v.innerHTML = viewZones(); bindZones(); renderOrganizeBar(); return; }
  if(el.id==='f_prod' || el.id==='f_shelf'){
    const pd = ($('#f_prod')||{}).value;
    const sl = parseInt(($('#f_shelf')||{}).value, 10);
    if(pd && !isNaN(sl) && sl>0 && $('#f_exp')) $('#f_exp').value = addDays(pd, sl);
  }
  if(el.id==='f_odate' || el.id==='f_oshelf'){
    const od = ($('#f_odate')||{}).value;
    const os = parseInt(($('#f_oshelf')||{}).value, 10);
    const hintEl = document.getElementById('openedExpHint');
    if(hintEl){
      if(od && !isNaN(os) && os > 0){
        const d2 = addDays(od, os);
        hintEl.innerHTML = '<div class="notice" style="margin-top:8px;background:var(--primary-l);color:var(--primary);font-weight:500;font-size:12px">'+T('opened_date_hint',{d:d2})+'</div>';
      }else{ hintEl.innerHTML = ''; }
    }
  }
  if(el.id === 'rebuyQtyInput'){
    const v = parseInt(el.value, 10) || 1;
    document.querySelectorAll('[data-act="rebuyQtySet"]').forEach(c=>{
      c.classList.toggle('on', parseInt(c.dataset.n,10) === v);
    });
    return;
  }
  if(el.id === 'f_name'){
    const hintEl = document.getElementById('nameMatchHint');
    if(!hintEl) return;
    const m = matchShelfLife(el.value);
    if(m){
      hintEl.className = 'match-hint';
      hintEl.innerHTML = ICON.sparkle + '<div class="txt">'+buildMatchHint(m)+'</div>'+
        '<button class="act" data-act="applyShelf" data-days="'+(m.d||0)+'" data-od="'+(m.od||0)+'" data-w="'+(m.w||0)+'" data-cat="'+(m.catId||'')+'">'+T('apply')+'</button>';
      const catEl = $('#f_cat');
      if(catEl && !catEl.value && m.catId) catEl.value = m.catId;
    }else{
      hintEl.className = 'match-hint hidden';
      hintEl.innerHTML = '';
      const catEl = $('#f_cat');
      const guess = matchCategoryOnly(el.value);
      if(catEl && !catEl.value && guess) catEl.value = guess;
    }
  }
});
function saveItemForm(id){
  const v = k => { const el = $('#f_'+k); return el ? el.value.trim() : ''; };
  const name = v('name');
  if(!name){ toast(T('need_name')); $('#f_name').focus(); return; }
  const openedEl = document.querySelector('[data-act="toggleOpened"]');
  const opened = openedEl ? openedEl.classList.contains('on') : false;
  let qtyVal = parseFloat(v('qty'));
  if(!v('qty') || isNaN(qtyVal) || qtyVal < 1) qtyVal = 1;
  let catId = v('cat');
  if(!catId){
    const m = matchShelfLife(name);
    catId = m ? m.catId : matchCategoryOnly(name);
  }
  const data = {
    name, barcode: v('barcode'), catId, locId: v('loc'),
    qty: qtyVal, unit: v('unit'),
    price: parseFloat(v('price')) || 0,
    minQty: parseFloat(v('min')) || 0,
    purchaseDate: v('pdate'), prodDate: v('prod'),
    shelfLife: parseInt(v('shelf'),10) || 0,
    expDate: v('exp'),
    opened, openedDate: v('odate'),
    afterOpenShelf: parseInt(v('oshelf'),10) || 0,
    warrantyUntil: v('warranty'),
    note: v('note'), photo: window.__currentPhoto || ''
  };
  if(id){
    const it = S.items.find(i=>i.id===id);
    if(it) Object.assign(it, data, {updatedAt:Date.now(), lastUsedAt:Date.now()});
  }else{
    S.items.push(Object.assign({ id:uid('i_'), createdAt:Date.now(), lastUsedAt:Date.now(), lastTakenAt:0, lastPutAt:0 }, data));
    S.stats.totalAdded = (S.stats.totalAdded||0) + 1;
    if((+data.price||0) >= 1000) S.stats.luxuryAdded = 1;
    if(data.name && data.barcode && (+data.price>0) && data.expDate && data.catId && data.locId && data.unit) S.stats.perfectItem = 1;
    const hr = new Date().getHours();
    if(hr >= 0 && hr < 5) S.stats.nightAdded = 1;
    const topCats = S.categories.filter(c=>!c.parentId && c.id !== 'c_other').map(c=>c.id);
    const usedTops = new Set();
    S.items.forEach(it=>{
      if(!it.catId) return;
      let c = catOf(it.catId);
      while(c && c.parentId) c = catOf(c.parentId);
      if(c && topCats.indexOf(c.id) >= 0) usedTops.add(c.id);
    });
    if(usedTops.size >= topCats.length) S.stats.allCatsUsed = 1;
  }
  if(data.barcode){
    if(!S.barcodeCache) S.barcodeCache = {};
    S.barcodeCache[data.barcode] = { name: data.name, catId: data.catId, unit: data.unit, price: data.price, ts: Date.now() };
  }
  window.__currentPhoto = '';
  markRecorded();
  save(); closeSheet(); toast(T('saved')); checkAchievements(); render({noScroll:true});
}

    const s = document.getElementById('splash');
