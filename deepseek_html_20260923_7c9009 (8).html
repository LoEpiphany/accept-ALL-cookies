<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4A9D7F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>万物归序</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --primary:#4A9D7F;--primary-d:#3A8068;--primary-l:#E8F4EF;--on-primary:#FFFFFF;
  --bg:#F2F3F5;--card:#FFFFFF;--card-2:#F7F8FA;--text:#1A1D1F;--text-2:#6B7280;--text-3:#9CA3AF;
  --border:#E5E7EB;--danger:#DC4C3E;--danger-l:#FDECEA;--warn:#D97706;--warn-l:#FEF3E2;
  --ok:#16A34A;--ok-l:#E8F5EC;--fresh:#0EA5A5;--fresh-l:#E0F5F5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0E1012;--card:#1A1D20;--card-2:#242830;--text:#ECEEF0;--text-2:#9BA3AE;--text-3:#6B7280;
  --border:#2A2F36;--danger-l:#3A1F1C;--warn-l:#3A2A16;--ok-l:#16301F;--fresh-l:#0F2929;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
#splash{position:fixed;inset:0;z-index:9999;background:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:78px;height:78px;color:#fff}
#splash .name{color:#fff;font-size:26px;font-weight:600;letter-spacing:6px;padding-left:6px}
#splash .slogan{color:rgba(255,255,255,.82);font-size:13px;letter-spacing:2px}
#topbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:1px}
#topbar .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);flex:0 0 38px;transition:transform .15s}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:scale(.94)}
#view{flex:1;padding:0 18px 130px}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:600px;margin:0 auto;display:flex;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--text-3);cursor:pointer;user-select:none;position:relative;transition:color .15s,transform .12s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--primary)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:600;text-align:center}
.tab.mid svg{width:26px;height:26px}
.sec{font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.5px;margin:22px 0 10px}
.sec:first-child{margin-top:8px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text-2)}
.small{font-size:12.5px}
.mt10{margin-top:10px}
.mt14{margin-top:14px}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.stat .l{font-size:12px;color:var(--text-3);margin-top:3px}
.stat.danger .n{color:var(--danger)}
.stat.warn .n{color:var(--warn)}
.stat.ok .n{color:var(--ok)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .15s,opacity .15s,box-shadow .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.item:active{transform:scale(.99);opacity:.9}
.item.important{border-left:3px solid var(--fresh)}
.item .ic{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--card-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .ic svg{width:20px;height:20px}
.item .ic img{width:100%;height:100%;object-fit:cover}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .rt{text-align:right;flex:0 0 auto;min-width:0}
.item .qty{font-size:12px;color:var(--text-3)}
.item .days{font-size:10.5px;color:var(--text-3);margin-top:2px}
.item .days.soon{color:var(--warn)}
.item .days.over{color:var(--danger)}
.item .days.open{color:var(--primary)}
.item .days.idle{color:var(--text-2)}
.item .cbx{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.item.selected .cbx{background:var(--primary);border-color:var(--primary);color:#fff}
.item .cbx svg{width:14px;height:14px;display:none}
.item.selected .cbx svg{display:block}
.room-items-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));gap:8px;padding-left:0}
.item.compact{flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:12px 6px 10px;margin-bottom:0;min-height:0;text-align:center;position:relative;background:var(--card);box-shadow:var(--shadow);touch-action:manipulation;transition:transform .15s,box-shadow .15s}
.item.compact:active{transform:scale(.96)}
.item.compact .ic{width:38px;height:38px;flex:0 0 38px;border-radius:10px}
.item.compact .ic svg{width:19px;height:19px}
.item.compact .nm{font-size:11.5px;font-weight:500;line-height:1.25;color:var(--text);max-width:100%;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;letter-spacing:-.2px}
.item.compact .qty-badge{position:absolute;top:5px;right:5px;min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--card-2);color:var(--text-2);font-size:10px;font-weight:600;line-height:16px;text-align:center;pointer-events:none}
.item.compact .state-dot{position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;pointer-events:none}
.item.compact.st-danger .state-dot{background:var(--danger);box-shadow:0 0 0 2px rgba(220,76,62,.15)}
.item.compact.st-warn .state-dot{background:var(--warn);box-shadow:0 0 0 2px rgba(217,119,6,.15)}
.item.compact.st-idle .state-dot{background:var(--text-3);box-shadow:0 0 0 2px rgba(156,163,175,.15)}
.item.compact.important{border-left:none;border-top:2px solid var(--fresh);border-radius:12px}
.item.compact.selected{background:var(--primary-l);border-color:var(--primary);box-shadow:0 0 0 1.5px var(--primary),0 2px 8px rgba(74,157,127,.15)}
.item.compact.dragging{opacity:.35;transform:scale(.98)}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:500;margin-top:3px}
.tag.danger{background:var(--danger-l);color:var(--danger)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.fresh{background:var(--fresh-l);color:var(--fresh)}
.tag.open{background:var(--primary-l);color:var(--primary)}
.tag.idle{background:var(--card-2);color:var(--text-2)}
.tag.warranty{background:#EEF3FF;color:#3A5FCD}
[data-theme="dark"] .tag.warranty{background:#1D2740;color:#7D96E8}
.tag.reuse{background:#FFF4E5;color:#B45309}
[data-theme="dark"] .tag.reuse{background:#3A2A16;color:#FBBF24}
.reuse-tip{background:linear-gradient(135deg,#FFF8EE 0%,#FEF3E2 100%);border:1px solid #F5D9A8;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12.5px;color:#8B5E1F;line-height:1.55}
[data-theme="dark"] .reuse-tip{background:#2A2016;border-color:#4A3A1F;color:#F5C97A}
.reuse-tip b{color:#B45309;font-size:13px}
[data-theme="dark"] .reuse-tip b{color:#FBBF24}
.drag-ghost{pointer-events:none;z-index:9999;margin:0;opacity:.95;transform:scale(1.06) rotate(-2deg);box-shadow:0 14px 32px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.12);background:var(--card);border-radius:14px;border:1px solid var(--border);transition:none!important;animation:none!important}
.room-blk.drop-hover{outline:2px dashed var(--primary);outline-offset:4px;background:var(--primary-l);border-radius:10px;transition:background .15s,outline-color .15s}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:11px 14px 11px 38px;background:var(--card);border:1px solid transparent;border-radius:12px;font-size:14.5px;color:var(--text);font-family:inherit;outline:none;box-shadow:var(--shadow);transition:border-color .15s}
.search input:focus{border-color:var(--primary)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -18px 4px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:20px;background:var(--card);color:var(--text-2);font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:transform .12s}
.chip.on{background:var(--primary);color:var(--on-primary);font-weight:500}
.empty{text-align:center;color:var(--text-3);padding:50px 20px;font-size:14px}
.empty svg{width:52px;height:52px;opacity:.4;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--card)}
.field textarea{resize:vertical;min-height:60px}
.field select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:14px;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{color:var(--danger)}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:14.5px;font-weight:500;font-family:inherit;cursor:pointer;background:var(--card-2);color:var(--text);transition:transform .12s,filter .12s,background .12s}
.btn svg{width:16px;height:16px;flex:0 0 16px;vertical-align:-2px;display:inline-block}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.block{width:100%;display:block}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn:active{opacity:.85;transform:scale(.97)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.btn.sm svg{width:14px;height:14px;flex:0 0 14px;vertical-align:-2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.rebuy{background:linear-gradient(135deg,#4A9D7F,#3A8068);color:#fff;font-weight:600}
.add-sheet{padding:4px 0 0}
.add-hero{display:flex;align-items:center;gap:16px;padding:22px 18px;background:var(--card-2);border:1px solid transparent;border-radius:16px;cursor:pointer;transition:all .2s;margin-bottom:12px;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.add-hero:active{transform:scale(.985);border-color:var(--primary)}
.add-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%, var(--primary-l) 0%, transparent 60%);opacity:.7;pointer-events:none}
.add-hero .hero-ico{width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px rgba(74,157,127,.6);position:relative;z-index:1}
.add-hero .hero-ico svg{width:28px;height:28px}
.add-hero .hero-txt{flex:1;min-width:0;position:relative;z-index:1}
.add-hero .hero-t{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px}
.add-hero .hero-d{font-size:12.5px;color:var(--text-2);line-height:1.5}
.add-hero .hero-arr{width:20px;height:20px;color:var(--text-3);flex:0 0 20px;transition:transform .2s;position:relative;z-index:1}
.add-hero:active .hero-arr{transform:translateX(3px)}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-mini{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 16px;background:var(--card-2);border:1px solid transparent;border-radius:14px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;text-align:center}
.add-mini:active{transform:scale(.96);border-color:var(--primary);background:var(--card)}
.add-mini .mi-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text-2);border:1px solid var(--border);transition:all .18s}
.add-mini .mi-ico svg{width:22px;height:22px}
.add-mini:active .mi-ico{color:var(--primary);border-color:var(--primary)}
.add-mini .mi-t{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.add-mini .mi-d{font-size:11px;color:var(--text-3);margin-top:-6px;line-height:1.4;font-weight:400}
.add-hero.disabled{opacity:.6}
.add-hero.disabled .hero-ico{background:linear-gradient(135deg,#94A3B8 0%,#64748B 100%);box-shadow:none}
.add-hero.disabled::after{content:"未配置 API Key";position:absolute;top:12px;right:14px;font-size:10.5px;color:var(--warn);background:var(--warn-l);padding:2px 8px;border-radius:8px;font-weight:500;z-index:1}
.house-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 0}
.house-option{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:14px 10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;text-align:center}
.house-option:active{transform:scale(.97);border-color:var(--primary);background:var(--primary-l)}
.house-option .ho-icon{width:34px;height:34px;flex:0 0 34px;color:var(--primary);display:flex;align-items:center;justify-content:center}
.house-option .ho-icon svg{width:100%;height:100%}
.house-option .ho-title{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:-.2px;line-height:1.25}
.house-option .ho-sub{font-size:10.5px;color:var(--text-3);line-height:1.3;margin-top:-2px}
.reselect-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:16px;background:linear-gradient(135deg,var(--primary-l) 0%,var(--card-2) 100%);border:1.5px dashed var(--primary);border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;transition:all .18s;font-family:inherit}
.reselect-btn:active{transform:scale(.98);background:var(--primary-l)}
.reselect-btn .rb-icon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px -3px rgba(74,157,127,.7)}
.reselect-btn .rb-icon svg{width:20px;height:20px}
.reselect-btn .rb-txt{flex:1;min-width:0}
.reselect-btn .rb-t{font-size:14px;font-weight:700;color:var(--primary);letter-spacing:-.2px}
.reselect-btn .rb-d{font-size:11.5px;color:var(--text-2);margin-top:3px;line-height:1.4}
.reselect-btn .rb-arr{width:18px;height:18px;color:var(--primary);flex:0 0 18px;opacity:.7}
.mask{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
.mask.hidden{display:none}
.sheet{position:relative;width:100%;max-width:600px;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px calc(80px + env(safe-area-inset-bottom));animation:slideUp .25s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-hd h3{margin:0;font-size:18px;font-weight:600;padding-right:40px}
.sheet-close{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(50% - 300px + 12px);width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.15);border:1px solid var(--border);color:var(--text-2);font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:310;line-height:1;padding:0}
.mask:not(.hidden) .sheet-close{display:flex}
@media (max-width:600px){.sheet-close{right:12px}}
.sheet-close:active{transform:scale(.92)}
.sheet-foot{display:flex;gap:10px;margin-top:22px}
.sheet-foot .btn{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;padding:0;margin:0;background:none;outline:none;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;flex:0 0 auto;transition:transform .1s ease}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--card) inset}
.sw:active{transform:scale(.92)}
.sw.custom{background:conic-gradient(from 0deg,#f87171,#fbbf24,#4ade80,#22d3ee,#818cf8,#f472b6,#f87171);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sw.custom input{opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.switch{width:46px;height:27px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;transition:.22s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--primary)}
.switch.on::after{left:22px}
.seg{display:flex;background:var(--card-2);border-radius:9px;padding:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--text-2);padding:7px 10px;font-size:13px;border-radius:7px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-row .hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar-row .hd .nm{color:var(--text)}
.bar-row .hd .vl{color:var(--text-3)}
.bar{height:8px;border-radius:5px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--primary);transition:width .4s ease}
.scan-box{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;box-shadow:var(--shadow)}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:20% 12%;border:2px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}
.scan-frame::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.scan-tip{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cat-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);transition:background .15s}
.cat-row:last-child{border-bottom:none}
.cat-row .ic{width:34px;height:34px;border-radius:9px;background:var(--card-2);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.cat-row .ic svg{width:17px;height:17px}
.cat-row .cn{flex:1;min-width:0}
.cat-row .cn .t{font-size:14.5px;font-weight:500}
.cat-row .cn .s{font-size:12px;color:var(--text-3);margin-top:1px}
.cat-row.sub{padding-left:28px}
.mini{background:none;border:none;color:var(--text-3);font-size:15px;cursor:pointer;padding:6px 8px;border-radius:8px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,transform .12s}
.mini svg{width:15px;height:15px}
.mini:active{background:var(--card-2)}
.mini.del{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,12px);z-index:400;background:rgba(26,29,31,.94);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.22s;max-width:85vw;text-align:center;backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.detail-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:var(--text-3)}
.detail-row .v{color:var(--text);font-weight:500;text-align:right;max-width:60%}
.notice{background:var(--card-2);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--text-2);line-height:1.6}
.notice.warn{background:var(--warn-l);color:var(--warn);font-weight:500}
.badge-ok{display:inline-block;background:var(--ok-l);color:var(--ok);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;margin-left:6px}
.badge-info{display:inline-block;background:var(--primary-l);color:var(--primary);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;margin-left:6px}
.alert-sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.3px;margin:22px 0 10px}
.alert-sec .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.alert-sec .cnt{color:var(--text-3);font-weight:500}
.loc-picker{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
.loc-picker:active{background:var(--card);border-color:var(--primary)}
.loc-picker.open{border-color:var(--primary);background:var(--card)}
.loc-picker-icon{width:18px;height:18px;flex:0 0 18px;color:var(--primary);display:flex;align-items:center;justify-content:center}
.loc-picker-icon svg{width:100%;height:100%}
.loc-picker-text{flex:1;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.loc-picker-text.empty{color:var(--text-3)}
.loc-picker-arrow{width:16px;height:16px;color:var(--text-3);flex:0 0 16px;transition:transform .2s}
.loc-picker.open .loc-picker-arrow{transform:rotate(180deg)}
.loc-panel{margin-top:10px;padding:14px;background:var(--card-2);border:1px solid var(--border);border-radius:12px;max-height:300px;overflow-y:auto;animation:locFade .18s ease}
@keyframes locFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.loc-group{margin-bottom:16px}
.loc-group:last-child{margin-bottom:0}
.loc-group-title{font-size:12.5px;color:var(--text-3);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.loc-group-title svg{width:13px;height:13px;color:var(--text-3);flex:0 0 13px}
.loc-chips{display:flex;flex-wrap:wrap;gap:8px}
.loc-chip{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:20px;padding:7px 14px;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.loc-chip:active{transform:scale(.95)}
.loc-chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.match-hint{display:flex;align-items:center;gap:8px;background:var(--primary-l);color:var(--primary);border-radius:9px;padding:9px 12px;margin-top:8px;font-size:12.5px;line-height:1.45;animation:locFade .2s ease}
.match-hint svg{width:15px;height:15px;flex:0 0 15px}
.match-hint .txt{flex:1;min-width:0}
.match-hint .act{border:none;background:var(--primary);color:#fff;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;flex:0 0 auto}
.match-hint .act:active{opacity:.85}
.photo-box{width:64px;height:64px;border-radius:11px;background:var(--card-2);border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:2px;cursor:pointer;flex:0 0 64px;overflow:hidden;position:relative}
.photo-box svg{width:19px;height:19px}
.photo-box span{font-size:9.5px}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.checkin-card{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);border-radius:16px;padding:18px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);margin-bottom:12px;position:relative;overflow:hidden}
.checkin-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.checkin-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.checkin-streak{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:.3px}
.checkin-streak svg{width:22px;height:22px}
.checkin-points{font-size:12.5px;opacity:.9}
.checkin-level{display:inline-block;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:500;margin-top:4px}
.checkin-btn{width:100%;margin-top:14px;padding:12px;background:#fff;color:var(--primary);border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;position:relative;z-index:1;transition:transform .12s}
.checkin-btn:active{transform:scale(.98)}
.checkin-btn.done{background:rgba(255,255,255,.25);color:#fff;cursor:default}
.checkin-bonus{font-size:11.5px;opacity:.9;margin-top:8px;text-align:center;position:relative;z-index:1}
.remind-bar{display:flex;align-items:center;gap:10px;background:var(--warn-l);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.5;transition:transform .12s}
.remind-bar svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
.remind-bar:active{opacity:.85}
.remind-bar .txt{flex:1}
.field-bar{display:flex;align-items:center;gap:10px;background:var(--ok-l);color:var(--ok);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;font-weight:500}
.field-bar svg{width:18px;height:18px;flex:0 0 18px}
.field-bar .txt{flex:1}
.idle-bar{display:flex;align-items:center;gap:10px;background:var(--card-2);color:var(--text-2);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;font-weight:500;cursor:pointer;transition:transform .12s}
.idle-bar svg{width:18px;height:18px;flex:0 0 18px;color:var(--text-3)}
.idle-bar .txt{flex:1}
.idle-bar b{color:var(--text)}
.week-report{background:linear-gradient(135deg,var(--primary-l) 0%,var(--card-2) 100%);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.week-report .wr-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.week-report .wr-title{font-size:15px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;flex:0 0 auto}
.week-report .wr-title svg{width:18px;height:18px}
.week-report .wr-select{background:var(--card);border:1px solid var(--border);color:var(--text-2);font-size:11.5px;font-family:inherit;border-radius:8px;padding:5px 8px;outline:none;cursor:pointer;max-width:58%;flex:0 1 auto}
.week-report .wr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.week-report .wr-item{text-align:center}
.week-report .wr-num{font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.week-report .wr-lbl{font-size:10.5px;color:var(--text-3);margin-top:3px}
.week-report .wr-hint{font-size:11.5px;color:var(--text-2);margin-top:10px;text-align:center;line-height:1.5}
.week-report .wr-empty{font-size:13px;color:var(--text-2);text-align:center;padding:20px 0 10px;line-height:1.7}
.layout-top-intro{font-size:12.5px;color:var(--text-2);line-height:1.65;background:var(--card-2);border-radius:10px;padding:11px 14px;margin-bottom:14px}
.layout-top-intro b{color:var(--text)}
.layout-floor{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.layout-floor-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;background:var(--card-2);transition:background .15s}
.layout-floor-header:active{background:var(--card)}
.layout-floor-header .lhicon{width:22px;height:22px;flex:0 0 22px;color:var(--primary);display:flex;align-items:center;justify-content:center}
.layout-floor-header .lhicon svg{width:100%;height:100%}
.layout-floor-header .lhnm{flex:1;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.layout-floor-header .lhc{font-size:12px;color:var(--text-3);flex:0 0 auto}
.layout-floor-header .lha{width:16px;height:16px;color:var(--text-3);flex:0 0 16px;transition:transform .2s}
.layout-floor.open .layout-floor-header .lha{transform:rotate(180deg)}
.layout-floor-body{padding:6px 14px 10px;display:none}
.layout-floor.open .layout-floor-body{display:block}
.layout-sub{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.layout-sub:last-child{border-bottom:none}
.layout-sub .ls-icon{width:18px;height:18px;flex:0 0 18px;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.layout-sub .ls-icon svg{width:100%;height:100%}
.layout-sub .ls-nm{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layout-sub .ls-nm.other{color:var(--text-3);font-style:italic;font-weight:500}
.layout-sub-actions{display:flex;gap:2px;flex:0 0 auto}
.layout-actions-row{display:flex;gap:6px;flex:0 0 auto}
.zone-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.zone-hd{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none;transition:background .15s}
.zone-hd:active{background:var(--card-2)}
.zone-hd .zic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:var(--primary-l);color:var(--primary);display:flex;align-items:center;justify-content:center}
.zone-hd .zic svg{width:17px;height:17px}
.zone-hd .znm{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-hd .zcnt{font-size:12px;color:var(--text-3);flex:0 0 auto}
.zone-hd .zarr{width:16px;height:16px;color:var(--text-3);flex:0 0 16px;transition:transform .2s}
.zone-card.open .zone-hd .zarr{transform:rotate(180deg)}
.zone-body{display:none;padding:0 14px 14px}
.zone-card.open .zone-body{display:block}
.room-blk{margin-bottom:14px;transition:background .15s,outline-color .15s;padding:4px;border-radius:10px}
.room-blk:last-child{margin-bottom:0}
.room-hd{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;color:var(--text-2);font-weight:500}
.room-hd svg{width:14px;height:14px;color:var(--text-3)}
.room-hd .rcount{margin-left:auto;color:var(--text-3);font-size:11.5px}
.room-empty{font-size:12px;color:var(--text-3);padding:6px 0 6px 22px;font-style:italic}
.organize-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:190;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.organize-bar .info{flex:1;font-size:13px;color:var(--text-2)}
.organize-bar .info b{color:var(--primary);font-size:15px}
.organize-bar .btn{flex:0 0 auto}
.focus-banner{background:linear-gradient(135deg,var(--fresh-l),var(--primary-l));border-radius:13px;padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.focus-banner:active{opacity:.9}
.focus-banner .fbi{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:rgba(255,255,255,.6);color:var(--fresh);display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .focus-banner .fbi{background:rgba(255,255,255,.08)}
.focus-banner .fbi svg{width:18px;height:18px}
.focus-banner .fbtxt{flex:1;min-width:0}
.focus-banner .fbttl{font-size:14px;font-weight:600;color:var(--text)}
.focus-banner .fbsub{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.4}
.focus-banner .fbnum{font-size:20px;font-weight:700;color:var(--fresh);flex:0 0 auto}
.ach-summary{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--primary-l),var(--card-2));border-radius:14px;padding:16px;margin-bottom:10px}
.ach-summary .big{font-size:26px;font-weight:700;color:var(--primary);line-height:1}
.ach-summary .txt{font-size:12.5px;color:var(--text-2);line-height:1.5}
.ach-summary .txt b{color:var(--text);font-size:13.5px;font-weight:600}
.ach-cat-title{font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.5px;margin:18px 0 6px;display:flex;align-items:center;gap:6px}
.ach-cat-title svg{width:13px;height:13px;flex:0 0 13px}
.ach-cat-title .c{color:var(--text-2);font-weight:500;margin-left:auto;font-size:11.5px}
.ach-card{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ach-card:last-child{border-bottom:none}
.ach-icon{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--card-2);color:var(--text-3);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);margin-top:1px}
.ach-icon svg{width:20px;height:20px}
.ach-card.unlocked .ach-icon{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ach-mid{flex:1;min-width:0}
.ach-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35}
.ach-name.locked{color:var(--text-2);font-weight:500}
.ach-reward{font-size:10.5px;color:var(--warn);background:var(--warn-l);padding:1px 7px;border-radius:8px;font-weight:500;flex:0 0 auto}
.ach-desc{font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.45}
.ach-progress{font-size:11px;color:var(--text-3);margin-top:5px;display:flex;align-items:center;gap:8px}
.ach-progress .bar{flex:1;max-width:80px;height:5px;border-radius:3px}
.ach-progress .bar i{background:var(--text-3)}
.ach-card.unlocked .ach-progress .bar i{background:var(--primary)}
.ach-check{width:20px;height:20px;color:var(--ok);flex:0 0 20px;margin-top:3px}
.ach-toast-wrap{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(26px);z-index:6000;width:calc(100% - 28px);max-width:400px;pointer-events:none;opacity:0;transition:opacity .35s cubic-bezier(.2,.9,.3,1),transform .35s cubic-bezier(.2,.9,.3,1)}
.ach-toast-wrap.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ach-toast{position:relative;background:linear-gradient(160deg,#fffdf7 0%,#fbf5e6 52%,#fffdf7 100%);border-radius:14px;padding:14px 16px 14px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 34px rgba(160,130,50,.22),0 2px 8px rgba(0,0,0,.07);overflow:hidden}
.ach-toast::before{content:"";position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,#c9a961 22%,#f7ecc8 50%,#c9a961 78%,transparent);}
.ach-toast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:linear-gradient(90deg,transparent,#e8d9a8 22%,#f7ecc8 50%,#e8d9a8 78%,transparent);opacity:.55;}
.ach-toast-corner{position:absolute;width:13px;height:13px;border:1.5px solid rgba(201,169,97,.55);pointer-events:none}
.ach-toast-corner.tl{top:5px;left:5px;border-right:none;border-bottom:none;border-top-left-radius:6px;}
.ach-toast-corner.tr{top:5px;right:5px;border-left:none;border-bottom:none;border-top-right-radius:6px;}
.ach-toast-corner.bl{bottom:5px;left:5px;border-right:none;border-top:none;border-bottom-left-radius:6px;}
.ach-toast-corner.br{bottom:5px;right:5px;border-left:none;border-top:none;border-bottom-right-radius:6px;}
.ach-toast-icon{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:radial-gradient(circle at 50% 32%,#fdf2d0 0%,#e8d9a8 72%);border:1.2px solid rgba(201,169,97,.6);display:flex;align-items:center;justify-content:center;color:#8a6d24;box-shadow:0 2px 8px rgba(201,169,97,.28),inset 0 1px 0 rgba(255,255,255,.9)}
.ach-toast-icon svg{width:21px;height:21px;}
.ach-toast-body{flex:1;min-width:0;}
.ach-toast-tag{font-size:9.5px;letter-spacing:3px;color:#b8944a;font-weight:700;margin-bottom:2px;padding-left:1px;text-transform:uppercase}
.ach-toast-name{font-size:14.5px;font-weight:700;color:#5c4a1e;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ach-toast-reward{font-size:11.5px;color:#a07f30;font-weight:600;background:rgba(201,169,97,.13);border:1px solid rgba(201,169,97,.28);padding:3px 9px;border-radius:10px;flex:0 0 auto;white-space:nowrap;}
.onboard-mask{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;transition:opacity .35s ease;text-align:center}
.onboard-mask.hidden{display:none}
.onboard-mask.closing{opacity:0;pointer-events:none}
.onboard-slide{display:none;flex-direction:column;align-items:center;gap:20px;max-width:380px;margin-bottom:140px;animation:onboardIn .4s cubic-bezier(.2,.9,.3,1)}
.onboard-slide.on{display:flex}
@keyframes onboardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.onboard-icon{width:120px;height:120px;border-radius:28px;background:linear-gradient(135deg,var(--primary-l),var(--card-2));color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative}
.onboard-icon::after{content:"";position:absolute;inset:-12px;border-radius:36px;border:1px dashed var(--primary);opacity:.25}
.onboard-icon svg{width:58px;height:58px}
.onboard-title{font-size:22px;font-weight:600;letter-spacing:.5px;line-height:1.35}
.onboard-desc{font-size:14px;color:var(--text-2);line-height:1.75;margin-top:-8px;max-width:320px}
.onboard-bottom{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 28px}
.onboard-dots{display:flex;gap:6px;justify-content:center}
.onboard-dots i{width:6px;height:6px;border-radius:50%;background:var(--border);transition:.25s}
.onboard-dots i.on{background:var(--primary);width:20px;border-radius:3px}
.onboard-next{width:100%;max-width:340px;padding:13px;background:var(--primary);color:var(--on-primary);border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s}
.onboard-next:active{opacity:.85}
.onboard-skip{background:none;border:none;color:var(--text-3);font-size:13px;font-family:inherit;cursor:pointer;padding:6px 12px}
.warranty-bar{display:flex;align-items:center;gap:8px;background:#EEF3FF;color:#3A5FCD;border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
[data-theme="dark"] .warranty-bar{background:#1D2740;color:#7D96E8}
.warranty-bar svg{width:16px;height:16px;flex:0 0 16px}
.warranty-bar .txt{flex:1}
.api-key-input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.confirm-mask{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:achFadeIn .2s ease}
.confirm-mask.hidden{display:none}
.confirm-box{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:26px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px rgba(220,76,62,.25);animation:achPop .35s cubic-bezier(.2,.9,.3,1.15)}
.confirm-box .cf-icon{width:54px;height:54px;margin:0 auto 16px;border-radius:50%;background:var(--danger-l);color:var(--danger);display:flex;align-items:center;justify-content:center}
.confirm-box .cf-icon svg{width:26px;height:26px}
.confirm-box .cf-title{font-size:20px;font-weight:800;color:var(--danger);text-align:center;letter-spacing:.5px;margin-bottom:12px;line-height:1.35}
.confirm-box .cf-msg{font-size:14.5px;color:var(--text);text-align:center;line-height:1.65;font-weight:600;margin-bottom:20px;white-space:pre-line}
.confirm-box .cf-btns{display:flex;gap:10px}
.confirm-box .cf-btns .btn{flex:1;padding:12px;font-size:15px;font-weight:600}
.confirm-box .cf-btns .btn.danger-fill{background:var(--danger);color:#fff;font-weight:700}
.lookup-panel{background:linear-gradient(135deg,var(--primary-l) 0%,var(--card-2) 100%);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.lookup-panel .lk-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lookup-panel .lk-title svg{width:17px;height:17px}
.lookup-panel .lk-input-wrap{display:flex;gap:8px}
.lookup-panel input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14.5px;color:var(--text);outline:none}
.lookup-panel input:focus{border-color:var(--primary)}
.lookup-panel .lk-btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s}
.lookup-result{margin-top:12px;background:var(--card);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.65;display:none}
.lookup-result.show{display:block}
.lookup-result .lr-name{font-weight:700;color:var(--text);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.lookup-result .lr-name svg{width:15px;height:15px;flex:0 0 15px;color:var(--primary)}
.lookup-result .lr-loc{color:var(--primary);font-weight:700}
.lookup-result .lr-tip{color:var(--text-3);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px}
.lookup-result .lr-tip svg{width:12px;height:12px;flex:0 0 12px;opacity:.7}
.rebuy-qty-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.rebuy-qty-btn{width:54px;height:54px;border-radius:14px;background:var(--card-2);border:1px solid var(--border);color:var(--text);font-size:24px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;padding:0;transition:all .12s}
.rebuy-qty-btn:active{transform:scale(.94);background:var(--primary-l);border-color:var(--primary);color:var(--primary)}
.rebuy-qty-num{width:110px;height:54px;text-align:center;font-size:24px;font-weight:700;background:var(--card-2);border:1.5px solid var(--border);border-radius:14px;font-family:inherit;color:var(--text);outline:none;padding:0}
.rebuy-qty-num:focus{border-color:var(--primary);background:var(--card)}
.rebuy-hero{text-align:center;padding:6px 0 18px}
.rebuy-hero .rb-name{font-size:17px;font-weight:700;letter-spacing:.3px;margin-bottom:6px}
.rebuy-hero .rb-shelf{font-size:12.5px;color:var(--text-3)}
.rebuy-hint{text-align:center;font-size:12px;color:var(--text-3);margin-top:14px;line-height:1.6}
/* 最近动态 */
.recent-move{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.recent-move .rm-ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.recent-move .rm-ic.take{background:var(--primary-l);color:var(--primary)}
.recent-move .rm-ic.put{background:var(--fresh-l);color:var(--fresh)}

.recent-move .rm-sub{font-size:11px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-move .rm-time{font-size:11px;color:var(--text-3);flex:0 0 auto}

/* 共享视图 */
.share-view{padding:20px 18px 40px;max-width:600px;margin:0 auto}
.share-hd{text-align:center;padding:14px 0 22px}
.share-hd .sh-logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,var(--primary-l),var(--card-2));color:var(--primary);display:flex;align-items:center;justify-content:center}
.share-hd .sh-logo svg{width:34px;height:34px}
.share-hd .sh-name{font-size:20px;font-weight:700;letter-spacing:4px;color:var(--text)}
.share-hd .sh-sub{font-size:12px;color:var(--text-3);margin-top:6px}
.share-result{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;transition:transform .12s}
.share-result .sr-ic{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--card-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.share-result .sr-ic svg{width:18px;height:18px}
.share-result .sr-ic img{width:100%;height:100%;object-fit:cover}
.share-result .sr-mid{flex:1;min-width:0}
.share-result .sr-nm{font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share-result .sr-loc{font-size:12px;color:var(--primary);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share-result .sr-qty{font-size:11.5px;color:var(--text-3);flex:0 0 auto}

/* 悬停效果 */
@media (hover: hover) and (pointer: fine){
  .btn:hover{ transform: translateY(-1px); filter: brightness(1.04); }

  .loc-chip:hover{ transform: scale(1.05); }
  .house-option:hover{ transform: scale(.98); border-color: var(--primary); background: var(--primary-l); }
  .add-hero:hover{ transform: scale(.99); border-color: var(--primary); }
  .add-mini:hover{ transform: scale(.98); border-color: var(--primary); background: var(--card); }
  .add-mini:hover .mi-ico{ color: var(--primary); border-color: var(--primary); }
  .reselect-btn:hover{ transform: scale(.99); background: var(--primary-l); }
  .cat-row:hover{ background: var(--card-2); }
  .zone-hd:hover{ background: var(--card-2); }
  .layout-floor-header:hover{ background: var(--card); }
  .layout-sub:hover{ background: var(--card-2); border-radius: 6px; }
  .mini:hover{ background: var(--card-2); transform: scale(1.08); }
  .sw:hover{ transform: scale(1.08); }
  .week-report:hover{ transform: scale(1.005); }
  .focus-banner:hover{ transform: scale(1.008); }
  .idle-bar:hover{ transform: scale(1.008); }
  .recent-move:hover{ transform: scale(1.01); }
  .share-result:hover{ transform: scale(1.01); }
  .lookup-panel .lk-btn:hover{ transform: scale(1.04); }
  .rebuy-qty-btn:hover{ background: var(--primary-l); border-color: var(--primary); color: var(--primary); transform: scale(1.04); }
  .confirm-box .cf-btns .btn:hover{ transform: translateY(-1px); }
  .ach-card:hover{ background: var(--card-2); border-radius: 8px; }
}
</style>

<script>
const Store = (() => {
  let mode = 'local';
  const memory = {};
  function probe(store){
    try{ const k='__p_'+Math.random(); store.setItem(k,'1'); store.removeItem(k); return true; }
    catch(e){ return false; }
  }
  try{
    if(!probe(window.localStorage)){
      mode = probe(window.sessionStorage) ? 'session' : 'memory';
    }
  }catch(e){ mode = 'memory'; }
  return {
    get mode(){ return mode; },
    get persistent(){ return mode === 'local'; },
    getItem(k){
      try{
        if(mode === 'local'){ const v = localStorage.getItem(k); if(v !== null) return v; }
        else if(mode === 'session'){ const v = sessionStorage.getItem(k); if(v !== null) return v; }
      }catch(e){}
      return memory[k] !== undefined ? memory[k] : null;
    },
    setItem(k, v){
      memory[k] = v;
      try{
        if(mode === 'local'){ localStorage.setItem(k, v); return true; }
        if(mode === 'session'){ sessionStorage.setItem(k, v); return true; }
        return false;
      }catch(e){
        if(mode === 'local'){
          mode = 'session';
          try{ sessionStorage.setItem(k, v); return true; }catch(e2){ mode = 'memory'; }
        }else if(mode === 'session'){ mode = 'memory'; }
        return false;
      }
    },
    removeItem(k){
      delete memory[k];
      try{ localStorage.removeItem(k); }catch(e){}
      try{ sessionStorage.removeItem(k); }catch(e){}
    }
  };
})();

const $ = s => document.querySelector(s);
const uid = p => (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function daysUntil(dateStr){ if(!dateStr) return null; const a = new Date(todayStr()+'T00:00:00').getTime(); const b = new Date(dateStr+'T00:00:00').getTime(); return Math.round((b-a)/86400000); }
function toast(msg, ms=1900){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), ms); }

function customConfirm(title, msg, onYes, opts){
  opts = opts || {};
  const mask = $('#confirmMask');
  mask.innerHTML =
    '<div class="confirm-box">'+
      '<div class="cf-icon">'+(ICON.warn||'')+'</div>'+
      '<div class="cf-title">'+esc(title)+'</div>'+
      '<div class="cf-msg">'+esc(msg)+'</div>'+
      '<div class="cf-btns">'+
        '<button class="btn" data-cf="no">取消</button>'+
        '<button class="btn '+(opts.danger?'danger-fill':'primary')+'" data-cf="yes">'+esc(opts.okText||'确定')+'</button>'+
      '</div>'+
    '</div>';
  mask.classList.remove('hidden');
  const handler = (e) => {
    const b = e.target.closest('[data-cf]');
    if(!b) return;
    const v = b.dataset.cf;
    mask.classList.add('hidden');
    mask.removeEventListener('click', handler);
    if(v === 'yes') onYes();
  };
  mask.addEventListener('click', handler);
}

function hex2rgb(h){ h = h.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hex(r,g,b){ return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join(''); }
function rgb2hsl(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h,s,l=(mx+mn)/2; if(mx===mn){h=s=0;} else { const d=mx-mn; s = l>.5 ? d/(2-mx-mn) : d/(mx+mn); switch(mx){ case r: h=(g-b)/d+(g<b?6:0); break; case g: h=(b-r)/d+2; break; default: h=(r-g)/d+4; } h/=6; } return [h*360, s*100, l*100]; }
function hsl2hex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12; const a=s*Math.min(l,1-l); const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return rgb2hex(f(0)*255, f(8)*255, f(4)*255); }

const S_ = (p, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const ICON = {
  home: S_('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>'),
  box: S_('<path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>'),
  scan: S_('<path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/>'),
  chart: S_('<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'),
  user: S_('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>'),
  search: S_('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  bell: S_('<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  plus: S_('<path d="M12 5v14M5 12h14"/>'),
  close: S_('<path d="M6 6l12 12M18 6 6 18"/>'),
  back: S_('<path d="M15 18l-6-6 6-6"/>'),
  edit: S_('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  trash: S_('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/>'),
  loc: S_('<path d="M12 21.5c-4.2-3.6-7-7-7-10.5a7 7 0 1 1 14 0c0 3.5-2.8 6.9-7 10.5Z"/><circle cx="12" cy="11" r="2.5"/>'),
  house: S_('<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9V20a.8.8 0 0 0 .8.8h11.4A.8.8 0 0 0 18.5 20V9"/>'),
  fire: S_('<path d="M12 3c1.5 3 5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.5 1 1 1.5 1.5 1.5 0-2-1-4-1-6C10.5 2 11 2.5 12 3Z"/>'),
  check: S_('<path d="M5 12l5 5L20 7"/>'),
  chevD: S_('<path d="M6 9l6 6 6-6"/>'),
  layer: S_('<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/>'),
  trophy: S_('<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>'),
  leaf: S_('<path d="M20 4c-8 0-14 4-14 11a5 5 0 0 0 8 4c3-2 5-6 6-15Z"/><path d="M6 20c2-2 5-3 8-3"/>'),
  sun: S_('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: S_('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'),

function T(k, vars){
  const d = LANG[S.settings.lang] || LANG.zh;
  let s = d[k] || LANG.zh[k] || k;
  if(vars) for(const kk in vars) s = s.split('{'+kk+'}').join(vars[kk]);
  return s;
}
function L(obj){
  if(!obj) return '';
  if(typeof obj === 'string') return obj;
  return obj[S.settings.lang] || obj.zh || '';
}

function matchShelfLife(name){
  if(!name) return null;
  const n = String(name).toLowerCase();
  let best = null, bestLen = 0;
  for(const p of SHELF_LIFE_PRESETS){
    for(const k of p.k){
      if(n.indexOf(k.toLowerCase()) !== -1 && k.length > bestLen){ best = p; bestLen = k.length; }
    }
  }
  return best;
}
function matchCategoryOnly(name){
  const m = matchShelfLife(name);
  return m ? m.catId : '';
}
function formatDays(d){
  if(d >= 365){ const y = d / 365; return (Number.isInteger(y) ? y : y.toFixed(1)) + ' 年'; }
  if(d >= 30){ return Math.floor(d / 30) + ' 个月'; }
  return d + ' 天';
}
function buildMatchHint(m){
  if(!m) return '';
  let txt = T('smart_match') + '：<b>' + esc(m.label) + '</b>';
  const parts = [];
  if(m.d > 0) parts.push('保质期约 ' + formatDays(m.d));
  if(m.od > 0) parts.push('开封后约 ' + formatDays(m.od));
  if(m.w > 0) parts.push('保修约 ' + formatDays(m.w));
  if(parts.length) txt += ' · ' + parts.join(' · ');
  return txt;
}

/* ★ 全局模糊搜索：自然语言理解 ★ */
const STOP_REGEX = /(那个|这个|上次|这次|买的|买了|我的|你的|他的|她的|它的|给我的|给|是|在|的|了|有|个|把|被|和|与|及|等等|一下|一个|一些|这些|那些|什么|哪儿|哪里|怎么|怎么样|找找|寻找|搜索|查找|看看|找|搜|查)/g;
const COLOR_MAP = { '蓝色':'蓝','蓝':'蓝','红色':'红','红':'红','绿色':'绿','绿':'绿','黄色':'黄','黄':'黄','白色':'白','白':'白','黑色':'黑','黑':'黑','紫色':'紫','紫':'紫','粉色':'粉','粉':'粉','橙色':'橙','橙':'橙','灰色':'灰','灰':'灰','棕色':'棕','棕':'棕','青色':'青','青':'青' };

function fuzzySearch(items, query){
  if(!query || !query.trim()) return items;
  const q = query.toLowerCase().trim();
  // 去除常见停用词
  let cleaned = q.replace(STOP_REGEX, ' ').replace(/\s+/g, ' ').trim();
  // 提取颜色词
  const colors = [];
  let remaining = cleaned;
  Object.keys(COLOR_MAP).forEach(c => {
    if(remaining.includes(c)){
      colors.push(COLOR_MAP[c]);
      remaining = remaining.split(c).join(' ');
    }
  });
  remaining = remaining.replace(/\s+/g, ' ').trim();
  const keywords = remaining.split(/\s+/).filter(w => w.length > 0);
  // 如果什么都没了，就用原查询词
  if(!keywords.length && !colors.length){
    keywords.push(q);
  }
  return items.filter(it => {
    const cat = catOf(it.catId);
    const loc = locOf(it.locId);
    const hay = (String(it.name||'') + ' ' + String(it.note||'') + ' ' + String(it.barcode||'') + ' ' + (cat?nm(cat):'') + ' ' + (loc?nm(loc):'')).toLowerCase();
    for(const w of keywords){
      if(hay.indexOf(w) < 0) return false;
    }
    for(const c of colors){
      if(hay.indexOf(c) < 0) return false;
    }
    return true;
  });
}

function effectiveExpDate(it){
  if(!it) return null;
  const d1 = it.expDate || null;
  let d2 = null;
  if(it.opened && it.openedDate && it.afterOpenShelf && +it.afterOpenShelf > 0){
    d2 = addDays(it.openedDate, +it.afterOpenShelf);
  }
  if(d1 && d2) return d1 < d2 ? d1 : d2;
  return d1 || d2;
}
function isUsingOpenedExpiry(it){
  if(!it || !it.opened || !it.openedDate || !it.afterOpenShelf || +it.afterOpenShelf <= 0) return false;
  const d1 = it.expDate || null;
  const d2 = addDays(it.openedDate, +it.afterOpenShelf);
  if(!d1) return true;
  return d2 < d1;
}
function expStatus(it){
  const d = daysUntil(effectiveExpDate(it));
  if(d === null) return 'none';
  if(d < 0) return 'expired';
  if(d <= (S.settings.warnDays||7)) return 'soon';
  return 'ok';
}
function expText(it){
  const d = daysUntil(effectiveExpDate(it));
  if(d===null) return '';
  if(d < 0) return T('exp_over',{n:-d});
  if(d===0) return T('exp_today');
  return T('exp_days',{n:d});
}

  return { kind:'ok', days:d };
}

/* 时间友好显示 */
function relativeTime(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if(h < 24) return h + ' 小时前';
  const d = Math.floor(h / 24);
  if(d < 7) return d + ' 天前';
  const dt = new Date(ts);
  return (dt.getMonth()+1) + '月' + dt.getDate() + '日';
}

function checkinStatus(){
  const st = S.stats || {};
  const today = todayStr();
  const yesterday = addDays(today, -1);
  const last = st.lastCheckin || '';
  const canCheckin = last !== today;
  let displayStreak = st.streak || 0;
  if(last && last !== today && last !== yesterday) displayStreak = 0;
  let newStreak;
  if(!last) newStreak = 1;
  else if(last === today) newStreak = st.streak;
  else if(last === yesterday) newStreak = (st.streak||0) + 1;
  else newStreak = 1;
  let bonus = 0;
  if(newStreak === 3) bonus = 5;
  else if(newStreak === 7) bonus = 15;
  else if(newStreak > 0 && newStreak % 30 === 0) bonus = 30;
  return { canCheckin, displayStreak, newStreak, reward:10+bonus, bonus, today };
}
function doCheckin(){

  S.stats.lastCheckin = cs.today;

function applyTheme(){
  try{
    const st = S.settings || {};
    const color = /^#[0-9a-fA-F]{6}$/.test(st.themeColor||'') ? st.themeColor : '#4A9D7F';
    const [r,g,b] = hex2rgb(color);
    const [h,s,l] = rgb2hsl(r,g,b);
    const dark = !!st.dark;
    const root = document.documentElement;
    root.dataset.theme = dark ? 'dark' : 'light';
    const primary = dark ? hsl2hex(h, Math.min(s,70), Math.max(l,58)) : color;
    root.style.setProperty('--primary', primary);
    root.style.setProperty('--primary-d', hsl2hex(h, s, dark ? Math.max(18,l-18) : Math.max(15,l-10)));
    root.style.setProperty('--primary-l', dark ? hsl2hex(h, Math.min(45,s), 15) : hsl2hex(h, Math.min(85,s), 94));
    root.style.setProperty('--on-primary', dark ? '#0E1012' : '#FFFFFF');
    const meta = document.querySelector('meta[name=theme-color]');
    if(meta) meta.content = dark ? '#0E1012' : color;
  }catch(err){ console.warn('applyTheme error:', err); }
}

/* ★ 周报：周选项 ★ */
function startOfWeek(d){
  const r = new Date(d);
  r.setHours(0,0,0,0);
  const day = r.getDay() || 7;
  r.setDate(r.getDate() - day + 1); // 周一
  return r;
}
function weekOptions(){
  const now = new Date();
  const regTs = S.settings.registeredAt || now.getTime();
  const reg = new Date(regTs);
  const nowWeekStart = startOfWeek(now);
  const regWeekStart = startOfWeek(reg);
  const opts = [];
  let w = new Date(nowWeekStart);
  let idx = 0;
  while(w >= regWeekStart && idx < 52){
    opts.push({ idx, start: new Date(w), end: new Date(w.getTime() + 6*86400000) });
    w.setDate(w.getDate() - 7);
    idx++;
  }
  if(!opts.length) opts.push({ idx:0, start: nowWeekStart, end: new Date(nowWeekStart.getTime()+6*86400000) });
  return opts;
}
function weekReportDataFor(idx){
  const opts = weekOptions();
  if(idx >= opts.length){
    return { before: true };
  }
  const { start, end } = opts[idx];
  const startTs = start.getTime();
  const endTs = end.getTime() + 86400000 - 1;
  const added = S.items.filter(i => (i.createdAt||0) >= startTs && (i.createdAt||0) <= endTs).length;
  const expired = S.items.filter(i => {
    const d = effectiveExpDate(i);
    if(!d) return false;
    const t = new Date(d + 'T00:00:00').getTime();
    return t >= startTs && t <= endTs;
  }).length;
  // 丢弃/签到：无法精确统计历史，这里用累计数近似
  const discarded = (idx === 0) ? (S.stats.totalDiscardExpired || 0) : 0;
  const checkinCount = (idx === 0) ? (S.stats.streak || 0) : 0;
  const fromStr = (start.getMonth()+1) + '月' + start.getDate() + '日';
  const toStr = (end.getMonth()+1) + '月' + end.getDate() + '日';
  return { before:false, added, expired, discarded, checkinCount, fromStr, toStr };
}
function weekLabel(idx, total){
  if(idx === 0) return T('week_selector_this');
  if(idx === 1) return T('week_selector_last');
  if(idx < 6) return T('week_selector_n', { n: idx });
  return T('week_selector_old', { n: idx + 1 });
}

/* ★ 最近取放 ★ */
function recentActivities(){
  const events = [];
  S.items.forEach(it => {
    if(it.lastTakenAt) events.push({ type:'take', item: it, time: it.lastTakenAt });
    if(it.lastPutAt) events.push({ type:'put', item: it, time: it.lastPutAt });
  });
  events.sort((a,b) => b.time - a.time);
  return events.slice(0, 8);
}

/* ★ 反向查找建议 ★ */
function suggestLocation(itemName){
  if(!itemName) return null;
  const name = String(itemName).trim();
  const exact = S.items.filter(i => (i.name||'').includes(name) && i.locId);
  if(exact.length){
    const locId = exact[0].locId;
    return { type:'existing', locId, path: getLocFullPath(locId), count: exact.length, name };
  }
  const m = matchShelfLife(name);
  if(m){
    const sameCat = S.items.filter(i => i.catId === m.catId && i.locId);
    if(sameCat.length){
      const locId = sameCat[0].locId;
      return { type:'samecat', locId, path: getLocFullPath(locId), catLabel: m.label, catId: m.catId };
    }
  }
  const catId = m ? m.catId : '';
  const cat = catOf(catId);
  const locs = (() => {
    if(/c_food|c_fresh|c_food_drink|c_food_snack|c_food_season|c_food_staple|c_food_can|c_fresh_cold|c_fresh_veg|c_fresh_meat|c_fresh_dairy/.test(catId)) return ['冰箱','吊柜','地柜'];
    if(/c_med/.test(catId)) return ['镜柜','床头柜'];
    if(/c_clean/.test(catId)) return ['储物柜','地柜'];
    if(/c_beauty|c_fem/.test(catId)) return ['镜柜','洗手台'];
    if(/c_digital/.test(catId)) return ['电视柜','书桌'];
    if(/c_safety/.test(catId)) return ['玄关','储物柜'];
    if(/c_cloth/.test(catId)) return ['衣柜'];
    if(/c_doc/.test(catId)) return ['书桌','收纳柜'];
    if(/c_pet_baby/.test(catId)) return ['次卧','收纳柜'];
    return ['收纳柜'];
  })();
  return { type:'new', catLabel: cat ? nm(cat) : T('uncat'), catId, suggestions: locs };
}

function itemRow(it){

  const idle = isIdle(it) && st !== 'expired' && st !== 'soon';
  let badge = '';
  if(st==='expired') badge = '<span class="tag danger">'+T('expired')+'</span>';
  else if(st==='soon') badge = '<span class="tag warn">'+esc(expText(it))+'</span>';
  else if(isLow(it))   badge = '<span class="tag danger">'+T('low')+'</span>';
  else if(idle) badge = '<span class="tag idle">闲置</span>';
  let openTag = '';
  if(it.opened) openTag = '<span class="tag open">'+T('opened_tag')+'</span>';
  const parts = [];
  if(cat) parts.push(esc(nm(cat)));

  let daysEl = '';
  const dd = daysUntil(effectiveExpDate(it));

    daysEl = '<div class="days">'+idleDays(it)+' 天未用</div>';

  if(it.photo){ iconHtml = '<div class="ic"><img src="'+it.photo+'" alt=""></div>'; }
  else{ iconHtml = '<div class="ic">'+catIcon(cat?cat.icon:'c_other')+'</div>'; }

function filteredItems(){
  const q = UI.q.trim();
  let arr = S.items.filter(it=>{
    // 模糊搜索
    if(q){
      const matched = fuzzySearch([it], q);
      if(!matched.length) return false;
    }
    if(UI.fcat){ if(it.catId !== UI.fcat){ const c = catOf(it.catId); if(!c || c.parentId !== UI.fcat) return false; } }
    if(UI.fst){ const st = expStatus(it); if(UI.fst==='low'){ if(!isLow(it)) return false; } else if(UI.fst==='idle'){ if(!isIdle(it)) return false; } else if(st !== UI.fst) return false; }
    if(UI.freshOnly && !isFreshItem(it)) return false;
    if(UI.focusOnly && !isImportantItem(it)) return false;
    return true;
  });
  if(UI.sort==='name')       arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh'));
  else if(UI.sort==='exp')   arr.sort((a,b)=>String(effectiveExpDate(a)||'9999').localeCompare(String(effectiveExpDate(b)||'9999')));
  else if(UI.sort==='price') arr.sort((a,b)=>(+b.price||0)-(+a.price||0));
  else                       arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}
function renderList(){

  let h = '<div class="checkin-card">';
  h += '<div class="checkin-top">';

  h += '<div class="checkin-level">'+esc(T(lv.key))+'</div>';
  h += '</div></div>';
  if(cs.canCheckin){
    h += '<button class="checkin-btn" data-act="checkin">'+T('checkin_today')+' +'+cs.reward+'</button>';

    let nextBonusAt = 3, nextBonusPts = 5;
    if(streak >= 3 && streak < 7){ nextBonusAt = 7; nextBonusPts = 15; }

    h += '<div class="checkin-bonus">'+T('checkin_next_bonus',{d:nextBonusAt,p:nextBonusPts})+'</div>';
  }else{
    h += '<button class="checkin-btn done" disabled>✓ '+T('checkin_done')+'</button>';
    h += '<div class="checkin-bonus">'+esc(T('checkin_all_done'))+'</div>';
  }
  h += '</div>';
  return h;

function itemDetailSheet(id){
  const it = S.items.find(i=>i.id===id);
  if(!it) return;
  const cat = catOf(it.catId), loc = locOf(it.locId);
  const st = expStatus(it);
  const total = (+it.price||0)*(+it.qty||0);
  const usingOpened = isUsingOpenedExpiry(it);
  const effExp = effectiveExpDate(it);
  const idle = isIdle(it) && st !== 'expired' && st !== 'soon';
  let rows = '';
  const row = (k,v) => v ? '<div class="detail-row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>' : '';
  if(it.photo){
    rows += '<div style="text-align:center;margin-bottom:14px"><img src="'+it.photo+'" alt="" style="max-width:100%;border-radius:12px;max-height:180px;object-fit:contain"></div>';
  }
  rows += row(T('cat'), cat?nm(cat):T('uncat'));
  rows += row(T('loc'), loc?getLocFullPath(loc.id):T('unloc'));
  rows += row(T('qty'), (it.qty||0)+(it.unit?it.unit:''));
  if(it.price) rows += row(T('price'), '¥'+(+it.price).toFixed(2));
  if(total) rows += row(T('value'), '¥'+total.toFixed(2));
  if(it.barcode) rows += row(T('barcode'), it.barcode);
  if(it.purchaseDate) rows += row(T('purchase'), it.purchaseDate);
  if(it.prodDate) rows += row(T('prod'), it.prodDate);
  if(it.shelfLife) rows += row(T('shelf'), it.shelfLife+' 天');
  if(it.expDate) rows += row(T('exp'), it.expDate+'（包装上）');
  if(it.opened){
    rows += row(T('opened_detail'), '✓' + (it.openedDate ? ' ' + it.openedDate : ''));
    if(it.afterOpenShelf) rows += row(T('afterOpenShelf'), it.afterOpenShelf + ' 天');
    if(usingOpened && effExp){ rows += row('→ 有效到期', effExp); }
  } else if(it.expDate){
    rows += row('→ 有效到期', effExp);
  }
  if(it.warrantyUntil){
    const w = warrantyStatus(it);
    let wtxt = it.warrantyUntil;
    if(w){
      if(w.kind==='expired') wtxt += '（已过保修）';
      else wtxt += '（剩 '+w.days+' 天）';
    }
    rows += row(T('warranty'), wtxt);
  }
  if(it.minQty) rows += row(T('min_qty'), it.minQty);
  if(idle) rows += row('闲置', idleDays(it) + ' 天未使用');
  if(it.note) rows += row(T('note'), it.note);
  let badge = '';
  if(st==='expired') badge = '<span class="tag danger">'+T('expired')+'</span>';
  else if(st==='soon') badge = '<span class="tag warn">'+esc(expText(it))+'</span>';
  else if(idle) badge = '<span class="tag idle">闲置 '+idleDays(it)+' 天</span>';
  let h = '<div class="sheet-hd"><h3>'+esc(it.name)+'</h3></div>';
  if(badge) h += '<div style="margin-bottom:12px">'+badge+'</div>';
  if(st==='expired'){
    h += '<div class="field-bar" style="margin-bottom:12px">'+ICON.leaf+'<div class="txt">'+T('field_clean_tip')+'</div></div>';
  }
  const w = warrantyStatus(it);
  if(w && (w.kind==='soon' || w.kind==='expired')){
    const wtext = w.kind==='expired' ? T('warranty_expired_days',{n:-w.days}) : T('warranty_days',{n:w.days});
    h += '<div class="warranty-bar">'+ICON.warranty+'<div class="txt">'+esc(wtext)+'</div></div>';
  }
  h += '<div class="card" style="margin-bottom:0">'+rows+'</div>';
  if(st === 'expired'){
    const tip = getReuseTip(it.name);
    if(tip){
      h += '<div class="reuse-tip"><b>'+T('reuse_title')+'</b><br>'+esc(tip.tip)+'</div>';
    } else {
      h += '<div class="reuse-tip"><b>'+T('reuse_title')+'</b><br>'+T('reuse_none')+'</div>';
    }
  }
  /* 取出/放回 + 重新入库 */
  h += '<div class="sheet-foot" style="flex-wrap:wrap">'+
    '<button class="btn" data-act="takeItem" data-id="'+it.id+'" style="flex:1 1 48%">'+ICON.take+' '+T('take_action')+'</button>'+
    '<button class="btn rebuy" data-act="rebuyItem" data-id="'+it.id+'" style="flex:1 1 48%">'+ICON.refresh+' '+T('rebuy')+'</button>'+
    '<button class="btn" data-act="editItem" data-id="'+it.id+'">'+T('edit_item')+'</button>'+
    '<button class="btn danger" data-act="delItem" data-id="'+it.id+'">'+T('del')+'</button>'+
    '</div>';
  openSheet(h);
}

function applyHouseTemplate(key){
  const tpl = HOUSE_TEMPLATES[key];
  const locs = [];
  if(!tpl || !tpl.floors.length){
    locs.push({ id:'l_other_'+uid(''), name:{zh:'其他',en:'Other'}, parentId:null, isOther:false, order:0 });
  }else{
    tpl.floors.forEach((f, i)=>{
      const floorId = 'l_'+uid('f_');
      locs.push({ id:floorId, name:{zh:f.zh,en:f.en}, parentId:null, isOther:false, order:i });
      f.rooms.forEach((r, j)=>{
        locs.push({ id:'l_'+uid('r_'), name:{zh:r.zh,en:r.en}, parentId:floorId, isOther:false, order:j });
      });
      locs.push({ id:'l_'+uid('o_'), name:{zh:'其他',en:'Other'}, parentId:floorId, isOther:true, order:999 });
    });
  }
  S.locations = locs;
  S.items.forEach(i => { i.locId = ''; });
  S.settings.layoutOnboarded = true;
  S.stats.customLocCreated = 1;
  save(); checkAchievements();
}
