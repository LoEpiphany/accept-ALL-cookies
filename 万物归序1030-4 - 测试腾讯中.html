<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#4A9D7F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>万物归序</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #4A9D7F;
            --primary-d: #3A8068;
            --primary-l: #E8F4EF;
            --on-primary: #FFFFFF;
            --bg: #F2F3F5;
            --bg-rgb: 242,243,245;
            --card: #FFFFFF;
            --card-2: #F7F8FA;
            --text: #1A1D1F;
            --text-2: #6B7280;
            --text-3: #9CA3AF;
            --border: #E5E7EB;
            --danger: #DC4C3E;
            --danger-l: #FDECEA;
            --warn: #D97706;
            --warn-l: #FEF3E2;
            --ok: #16A34A;
            --ok-l: #E8F5EC;
            --fresh: #0EA5A5;
            --fresh-l: #E0F5F5;
            --shadow: 0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg: #0E1012;
            --bg-rgb: 14,16,18;
            --card: #1A1D20;
            --card-2: #242830;
            --text: #ECEEF0;
            --text-2: #9BA3AE;
            --text-3: #6B7280;
            --border: #2A2F36;
            --danger-l: #3A1F1C;
            --warn-l: #3A2A16;
            --ok-l: #16301F;
            --fresh-l: #0F2929;
            --shadow: 0 1px 3px rgba(0,0,0,.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html, body {
            height: 100%;
            margin: 0
        }

        body {
            font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            background: var(--bg);
            color: var(--text);
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased
        }

        #app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            position: relative
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity .4s ease
        }

            #splash.hide {
                opacity: 0;
                pointer-events: none
            }

            #splash .logo {
                width: 78px;
                height: 78px;
                color: #fff
            }

            #splash .name {
                color: #fff;
                font-size: 26px;
                font-weight: 600;
                letter-spacing: 6px;
                padding-left: 6px
            }

            #splash .slogan {
                color: rgba(255,255,255,.82);
                font-size: 13px;
                letter-spacing: 2px
            }

        #topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(var(--bg-rgb),.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: calc(12px + env(safe-area-inset-top)) 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: background .2s
        }

            #topbar h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 1px
            }

            #topbar .sub {
                font-size: 12px;
                color: var(--text-3);
                margin-top: 2px
            }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--card);
            border: none;
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            flex: 0 0 38px;
            transition: transform .15s
        }

            .icon-btn svg {
                width: 19px;
                height: 19px
            }

            .icon-btn:active {
                transform: scale(.94)
            }
        /* 图片全屏查看器 */
        .img-viewer-mask {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

            .img-viewer-mask.show {
                opacity: 1;
                pointer-events: auto;
            }

            .img-viewer-mask img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 4px;
            }
        /* 图片全屏查看器 */
        .img-viewer-mask {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

            .img-viewer-mask.show {
                opacity: 1;
                pointer-events: auto;
            }

            .img-viewer-mask img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 4px;
            }

        #view {
            flex: 1;
            padding: 0 18px 130px
        }

        #tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: rgba(var(--bg-rgb),.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom)
        }

        .tabbar-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            position: relative
        }

        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 0 7px;
            font-size: 10.5px;
            color: var(--text-3);
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: color .15s,transform .12s
        }

            .tab svg {
                width: 22px;
                height: 22px
            }

            .tab.on {
                color: var(--primary)
            }

                .tab.on svg {
                    stroke-width: 2.2
                }

            .tab.mid.on {
                background: var(--primary);
                color: #fff
            }

                .tab.mid.on svg {
                    stroke: #fff
                }

            .tab .dot {
                position: absolute;
                top: 6px;
                left: calc(50% + 8px);
                min-width: 16px;
                height: 16px;
                border-radius: 8px;
                background: var(--danger);
                color: #fff;
                font-size: 10px;
                line-height: 16px;
                padding: 0 4px;
                font-weight: 600;
                text-align: center
            }

            .tab.mid svg {
                width: 26px;
                height: 26px
            }

        .sec {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin: 18px 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: .2px
        }

            .sec:first-child {
                margin-top: 8px
            }

            .sec::before {
                content: "";
                width: 3px;
                height: 14px;
                background: var(--primary);
                border-radius: 2px;
                flex: 0 0 3px
            }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 12px
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .muted {
            color: var(--text-2)
        }

        .small {
            font-size: 12.5px
        }

        .mt10 {
            margin-top: 10px
        }

        .mt14 {
            margin-top: 14px
        }

        .hidden {
            display: none !important
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .stat {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            transition: transform .15s
        }

            .stat .n {
                font-size: 24px;
                font-weight: 700;
                line-height: 1.2;
                letter-spacing: -.5px
            }

            .stat .l {
                font-size: 12px;
                color: var(--text-2);
                margin-top: 5px;
                line-height: 1.4
            }

            .stat.danger .n {
                color: var(--danger)
            }

            .stat.warn .n {
                color: var(--warn)
            }

            .stat.ok .n {
                color: var(--ok)
            }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
            cursor: pointer;
            position: relative;
            transition: transform .15s,opacity .15s,box-shadow .15s;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none
        }

            .item:active {
                transform: scale(.99);
                opacity: .9
            }

            .item.important {
                border-left: 3px solid var(--fresh)
            }

            .item .ic {
                width: 40px;
                height: 40px;
                flex: 0 0 40px;
                border-radius: 11px;
                background: var(--card-2);
                color: var(--text-2);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden
            }

                .item .ic svg {
                    width: 20px;
                    height: 20px
                }

                .item .ic img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover
                }

            .item .mid {
                flex: 1;
                min-width: 0
            }

            .item .nm {
                font-weight: 500;
                font-size: 14.5px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .item .sub {
                font-size: 12px;
                color: var(--text-3);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-top: 2px
            }

            .item .rt {
                text-align: right;
                flex: 0 0 auto;
                min-width: 0
            }

            .item .qty {
                font-size: 12px;
                color: var(--text-3)
            }

            .item .days {
                font-size: 10.5px;
                color: var(--text-3);
                margin-top: 2px
            }

                .item .days.soon {
                    color: var(--warn)
                }

                .item .days.over {
                    color: var(--danger)
                }

                .item .days.open {
                    color: var(--primary)
                }

                .item .days.idle {
                    color: var(--text-2)
                }

            .item .cbx {
                width: 22px;
                height: 22px;
                border: 2px solid var(--border);
                border-radius: 6px;
                flex: 0 0 22px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--card)
            }

            .item.selected .cbx {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff
            }

            .item .cbx svg {
                width: 14px;
                height: 14px;
                display: none
            }

            .item.selected .cbx svg {
                display: block
            }

        .room-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 8px;
            padding-left: 0
        }

        .item.compact {
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            padding: 12px 6px 10px;
            margin-bottom: 0;
            min-height: 0;
            text-align: center;
            position: relative;
            background: var(--card);
            box-shadow: var(--shadow);
            touch-action: manipulation;
            transition: transform .15s,box-shadow .15s
        }

            .item.compact:active {
                transform: scale(.96)
            }

            .item.compact .ic {
                width: 38px;
                height: 38px;
                flex: 0 0 38px;
                border-radius: 10px
            }

                .item.compact .ic svg {
                    width: 19px;
                    height: 19px
                }

            .item.compact .nm {
                font-size: 11.5px;
                font-weight: 500;
                line-height: 1.25;
                color: var(--text);
                max-width: 100%;
                white-space: normal;
                overflow: hidden;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                word-break: break-all;
                letter-spacing: -.2px
            }

            .item.compact .qty-badge {
                position: absolute;
                top: 5px;
                right: 5px;
                min-width: 18px;
                height: 16px;
                padding: 0 5px;
                border-radius: 8px;
                background: var(--card-2);
                color: var(--text-2);
                font-size: 10px;
                font-weight: 600;
                line-height: 16px;
                text-align: center;
                pointer-events: none
            }

            .item.compact .state-dot {
                position: absolute;
                top: 6px;
                left: 6px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                pointer-events: none
            }

            .item.compact.st-danger .state-dot {
                background: var(--danger);
                box-shadow: 0 0 0 2px rgba(220,76,62,.15)
            }

            .item.compact.st-warn .state-dot {
                background: var(--warn);
                box-shadow: 0 0 0 2px rgba(217,119,6,.15)
            }

            .item.compact.st-idle .state-dot {
                background: var(--text-3);
                box-shadow: 0 0 0 2px rgba(156,163,175,.15)
            }

            .item.compact.important {
                border-left: none;
                border-top: 2px solid var(--fresh);
                border-radius: 12px
            }

            .item.compact.selected {
                background: var(--primary-l);
                border-color: var(--primary);
                box-shadow: 0 0 0 1.5px var(--primary),0 2px 8px rgba(74,157,127,.15)
            }

            .item.compact.dragging {
                opacity: .35;
                transform: scale(.98)
            }

        .tag {
            display: inline-block;
            font-size: 10.5px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
            margin-top: 3px
        }

            .tag.danger {
                background: var(--danger-l);
                color: var(--danger)
            }

            .tag.warn {
                background: var(--warn-l);
                color: var(--warn)
            }

            .tag.ok {
                background: var(--ok-l);
                color: var(--ok)
            }

            .tag.fresh {
                background: var(--fresh-l);
                color: var(--fresh)
            }

            .tag.open {
                background: var(--primary-l);
                color: var(--primary)
            }

            .tag.idle {
                background: var(--card-2);
                color: var(--text-2)
            }

            .tag.warranty {
                background: var(--primary-l);
                color: var(--primary)
            }

        [data-theme="dark"] .tag.warranty {
            background: var(--primary-l);
            color: var(--primary)
        }

        .tag.reuse {
            background: #FFF4E5;
            color: #B45309
        }

        [data-theme="dark"] .tag.reuse {
            background: #3A2A16;
            color: #FBBF24
        }

        .reuse-tip {
            background: linear-gradient(135deg,var(--primary-l) 0%,var(--card-2) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text);
            line-height: 1.55
        }

        [data-theme="dark"] .reuse-tip {
            background: linear-gradient(135deg,var(--primary-l) 0%,var(--card-2) 100%);
            border-color: var(--border);
            color: var(--text)
        }

        .reuse-tip b {
            color: var(--primary);
            font-size: 13px
        }

        [data-theme="dark"] .reuse-tip b {
            color: var(--primary)
        }

        .drag-ghost {
            pointer-events: none;
            z-index: 99999;
            position: fixed;
            opacity: .95;
            transform: scale(1.06) rotate(-2deg);
            box-shadow: 0 14px 32px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.12);
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            transition: none !important;
            animation: none !important
        }

        .room-blk.drop-hover {
            outline: 2px dashed var(--primary);
            outline-offset: 4px;
            background: var(--primary-l);
            border-radius: 10px;
            transition: background .15s,outline-color .15s
        }

        .search {
            position: relative;
            margin-bottom: 12px
        }

            .search input {
                width: 100%;
                padding: 11px 14px 11px 38px;
                background: var(--card);
                border: 1px solid transparent;
                border-radius: 12px;
                font-size: 14.5px;
                color: var(--text);
                font-family: inherit;
                outline: none;
                box-shadow: var(--shadow);
                transition: border-color .15s
            }

                .search input:focus {
                    border-color: var(--primary)
                }

            .search svg {
                position: absolute;
                left: 13px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                color: var(--text-3)
            }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin: 0 -18px 4px;
            padding-left: 18px;
            padding-right: 18px;
            scrollbar-width: none
        }

            .chips::-webkit-scrollbar {
                display: none
            }

        .chip {
            flex: 0 0 auto;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--card);
            color: var(--text-2);
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: transform .12s
        }

            .chip.on {
                background: var(--primary);
                color: var(--on-primary);
                font-weight: 500
            }

        .empty {
            text-align: center;
            color: var(--text-3);
            padding: 50px 20px;
            font-size: 14px
        }

            .empty svg {
                width: 52px;
                height: 52px;
                opacity: .4;
                margin-bottom: 12px
            }

        .field {
            margin-bottom: 14px
        }

            .field label {
                display: block;
                font-size: 12.5px;
                color: var(--text-2);
                margin-bottom: 7px;
                font-weight: 600;
                letter-spacing: .1px
            }

            .field input, .field select, .field textarea {
                width: 100%;
                font-family: inherit;
                font-size: 15px;
                color: var(--text);
                background: var(--card-2);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 11px 13px;
                outline: none
            }

                .field input:focus, .field select:focus, .field textarea:focus {
                    border-color: var(--primary);
                    background: var(--card)
                }

            .field textarea {
                resize: vertical;
                min-height: 60px
            }

            .field select {
                appearance: none;
                background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
                background-repeat: no-repeat;
                background-position: right 12px center;
                background-size: 14px;
                padding-right: 34px
            }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .req {
            color: var(--danger)
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 14.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            background: var(--card-2);
            color: var(--text);
            transition: transform .12s,filter .12s,background .12s
        }

            .btn svg {
                width: 16px;
                height: 16px;
                flex: 0 0 16px;
                vertical-align: -2px;
                display: inline-block
            }

            .btn.primary {
                background: var(--primary);
                color: var(--on-primary)
            }

            .btn.block {
                width: 100%;
                display: block
            }

            .btn.danger {
                background: transparent;
                color: var(--danger);
                border: 1px solid var(--border)
            }

            .btn:active {
                opacity: .85;
                transform: scale(.97)
            }

            .btn.sm {
                padding: 7px 12px;
                font-size: 13px;
                border-radius: 8px;
                display: inline-flex;
                align-items: center;
                gap: 4px
            }

                .btn.sm svg {
                    width: 14px;
                    height: 14px;
                    flex: 0 0 14px;
                    vertical-align: -2px
                }

            .btn:disabled {
                opacity: .4;
                cursor: not-allowed
            }

            .btn.rebuy {
                background: linear-gradient(135deg,#4A9D7F,#3A8068);
                color: #fff;
                font-weight: 600
            }

        .add-sheet {
            padding: 4px 0 0
        }

        .add-hero {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 22px 18px;
            background: var(--card-2);
            border: 1px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s;
            margin-bottom: 12px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden
        }

            .add-hero:active {
                transform: scale(.985);
                border-color: var(--primary)
            }

            .add-hero::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 100% 0%, var(--primary-l) 0%, transparent 60%);
                opacity: .7;
                pointer-events: none
            }

            .add-hero .hero-ico {
                width: 56px;
                height: 56px;
                flex: 0 0 56px;
                border-radius: 16px;
                background: linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;

        const Store = (() => {
            let mode = 'local';

                try { const k = '__p_' + Math.random(); store.setItem(k, '1'); store.removeItem(k); return true; }
                catch (e) { return false; }
            }
            try {
                if (!probe(window.localStorage)) {
                    mode = probe(window.sessionStorage) ? 'session' : 'memory';
                }
            } catch (e) { mode = 'memory'; }
            return {
                get mode() { return mode; },
                get persistent() { return mode === 'local'; },
                getItem(k) {
                    try {
                        if (mode === 'local') { const v = localStorage.getItem(k); if (v !== null) return v; }
                        else if (mode === 'session') { const v = sessionStorage.getItem(k); if (v !== null) return v; }
                    } catch (e) { }
                    return memory[k] !== undefined ? memory[k] : null;
                },
                setItem(k, v) {
                    memory[k] = v;
                    try {
                        if (mode === 'local') { localStorage.setItem(k, v); return true; }
                        if (mode === 'session') { sessionStorage.setItem(k, v); return true; }
                        return false;
                    } catch (e) {
                        if (mode === 'local') {

                        return false;

                    delete memory[k];
                    try { localStorage.removeItem(k); } catch (e) { }
                    try { sessionStorage.removeItem(k); } catch (e) { }
                }
            };
        })();

        /* ★ PhotoDB：图片走 IndexedDB，localStorage 只存文本 ★ */
        const PhotoDB = (() => {
            let db = null, ready = false;
            const cache = {}; // key -> dataUrl，内存缓存，渲染时同步取
            function open() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject(new Error('no idb'));
                    const req = indexedDB.open('wanwu_photos', 1);
                    req.onupgradeneeded = e => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
                    };
                    req.onsuccess = e => { db = e.target.result; resolve(); };
                    req.onerror = e => reject(e.target.error);
                });
            }
            async function init() {
                try {
                    await open();
                    await new Promise(resolve => {
                        const tx = db.transaction('photos', 'readonly');
                        const req = tx.objectStore('photos').openCursor();
                        req.onsuccess = e => {
                            const cur = e.target.result;
                            if (cur) { cache[cur.key] = cur.value; cur.continue(); }
                        };
                        tx.oncomplete = resolve;
                        tx.onerror = resolve;
                    });
                    ready = true;
                } catch (e) { console.warn('PhotoDB init failed:', e); }
            }
            function get(key) { return cache[key] || ''; }
            function put(key, dataUrl) {
                cache[key] = dataUrl;
                if (!ready || !db) return Promise.resolve();
                return new Promise(resolve => {
                    try {
                        const tx = db.transaction('photos', 'readwrite');
                        const req = tx.objectStore('photos').put(dataUrl, key);
                        req.onsuccess = () => resolve();
                        req.onerror = () => resolve();
                        tx.oncomplete = () => resolve();
                    } catch (e) { resolve(); }
                });
            }
            function del(key) {
                delete cache[key];
                if (!ready || !db) return;
                try {
                    const tx = db.transaction('photos', 'readwrite');
                    tx.objectStore('photos').delete(key);
                } catch (e) { }
            }
            function clear() {
                Object.keys(cache).forEach(k => delete cache[k]);
                if (!ready || !db) return;
                try {
                    const tx = db.transaction('photos', 'readwrite');
                    tx.objectStore('photos').clear();
                } catch (e) { }
            }
            return { init, get, put, del, clear, get ready() { return ready; } };
        })();

        /* ★ 合并导入数据：物品追加、分类位置去重补齐、成就并集、stats 取较大值 ★ */
        function mergeImportedData(data) {
            const before = S.items.length;
            // 1. 物品：id 冲突则重新生成，避免覆盖
            const existingIds = new Set(S.items.map(i => i.id));
            (data.items || []).forEach(it => {
                if (existingIds.has(it.id)) {
                    const clone = JSON.parse(JSON.stringify(it));
                    clone.id = uid('i_');
                    S.items.push(clone);
                } else {
                    S.items.push(it);
                    existingIds.add(it.id);
                }
            });
            // 2. 分类：按 id 去重补齐
            const catIds = new Set(S.categories.map(c => c.id));
            (data.categories || []).forEach(c => {
                if (!catIds.has(c.id)) S.categories.push(c);
            });
            // 3. 位置：按 id 去重补齐
            const locIds = new Set(S.locations.map(l => l.id));
            (data.locations || []).forEach(l => {
                if (!locIds.has(l.id)) S.locations.push(l);
            });
            // 4. 成就：取并集
            if (data.achievements) {
                Object.keys(data.achievements).forEach(k => {
                    if (!S.achievements[k]) S.achievements[k] = data.achievements[k];
                });
            }
            // 5. 条码缓存：当前优先
            if (data.barcodeCache) {
                Object.keys(data.barcodeCache).forEach(k => {
                    if (!S.barcodeCache[k]) S.barcodeCache[k] = data.barcodeCache[k];
                });
            }
            // 6. stats：数字取较大值，字符串/空值补缺
            if (data.stats) {
                Object.keys(data.stats).forEach(k => {
                    const cur = S.stats[k];
                    const imp = data.stats[k];
                    if (typeof cur === 'number' && typeof imp === 'number') {
                        S.stats[k] = Math.max(cur, imp);
                    } else if (cur === undefined || cur === '' || cur === 0) {
                        S.stats[k] = imp;
                    }
                });
            }
            // 7. settings 保留当前（用户偏好不覆盖）
            ensureDefaultCats();
            ensureAllOthers();
            return S.items.length - before;
        }

                if (!newName.includes('多芬') && !newName.includes('德芙')) {
                    const regexDove = /(^|[^a-zA-Z])(dove)($|[^a-zA-Z])/gi;
                    newName = newName.replace(regexDove, (match, p1, p2, p3) => {
                        return p1 + zhDove + ' ' + p2 + p3;

                        newName = newName.replace(regex, (match, p1, p2, p3) => {
                            return p1 + zh + ' ' + p2 + p3;

            }

        function matchShelfLife(name) {
            if (!name) return null;
            const n = String(name).toLowerCase();

            // ⭐ 智能拦截：区分「文具笔记本」和「笔记本电脑」
            if (n.indexOf('笔记本') >= 0 || n.indexOf('电脑') >= 0) {
                // 1. 优先匹配电脑品牌（数码）
                if (/电脑|macbook|thinkpad|拯救者|联想小新|联想|戴尔|dell|惠普|hp|华硕|asus|华为|matebook|小米|redmi|机械革命|微星|msi|外星人|alienware|雷蛇|razer/.test(n)) {
                    return { catId: 'c_digital', label: '笔记本电脑', d: 0, w: 730 };
                }
                // 2. 匹配文具品牌（文具）
                if (/国誉|kokuyo|晨光|得力|deli|无印良品|muji|广博|齐心|纸本|手账|本子|记事本|活页/.test(n)) {
                    return { catId: 'c_stat', label: '笔记本', d: 0, w: 0 };
                }
                // 3. 兜底：如果只写了“笔记本”，没写电脑，默认归为文具
                if (n.indexOf('笔记本') >= 0 && n.indexOf('电脑') === -1) {
                    return { catId: 'c_stat', label: '笔记本', d: 0, w: 0 };
                }
            }

            // ================== 原有逻辑不变 ==================
            let best = null, bestLen = 0;
            for (const p of SHELF_LIFE_PRESETS) {
                for (const k of p.k) {
                    if (n.indexOf(k.toLowerCase()) !== -1 && k.length > bestLen) { best = p; bestLen = k.length; }
                }
            }
            return best;
        }
        function matchCategoryOnly(name) {
            const m = matchShelfLife(name);
            return m ? m.catId : '';
        }
        function formatDays(d) {
            if (d === 0) return S.settings.lang === 'zh' ? '0 天' : '0 days';
            if (d >= 365) {
                const y = d / 365;
                const yStr = Number.isInteger(y) ? y : y.toFixed(1);
                return S.settings.lang === 'zh' ? (d + ' 天（约 ' + yStr + ' 年）') : ('~' + yStr + ' years');
            }
            if (d >= 30) {
                return S.settings.lang === 'zh' ? (d + ' 天（约 ' + Math.floor(d / 30) + ' 个月）') : ('~' + Math.floor(d / 30) + ' months');
            }
            return S.settings.lang === 'zh' ? (d + ' 天') : (d + ' days');
        }
        function buildMatchHint(m) {
            if (!m) return '';
            let txt = T('smart_match') + '：<b>' + esc(m.label) + '</b>';

            if (m.d > 0) parts.push('保质期约 ' + formatDays(m.d));
            if (m.od > 0) parts.push('开封后约 ' + formatDays(m.od));
            if (m.w > 0) parts.push('保修约 ' + formatDays(m.w));
            if (parts.length) txt += ' · ' + parts.join(' · ');

            // 1. 清理查询词（处理颜色）
            let cleaned = q.replace(STOP_REGEX, ' ').replace(/\s+/g, ' ').trim();
            const colors = [];
            let remaining = cleaned;
            Object.keys(COLOR_MAP).forEach(c => {
                if (remaining.includes(c)) {
                    colors.push(COLOR_MAP[c]);
                    remaining = remaining.split(c).join(' ');
                }
            });
            remaining = remaining.replace(/\s+/g, ' ').trim();
            let keywords = remaining.split(/\s+/).filter(w => w.length > 0);
            if (!keywords.length && !colors.length) { keywords.push(q); }

            // 2. 拓展匹配词（场景库 + 同义词库）
            let allMatchWords = [...keywords];
            keywords.forEach(w => {
                // 场景拓展
                for (const [key, values] of Object.entries(SMART_MAP)) {
                    if (w.includes(key) || key.includes(w)) {
                        allMatchWords = allMatchWords.concat(values);
                        allMatchWords.push(key);
                    }
                }
                // 同义词拓展
                for (const [key, values] of Object.entries(SYNONYMS)) {
                    if (w.includes(key) || key.includes(w)) {
                        allMatchWords = allMatchWords.concat(values);
                        allMatchWords.push(key);
                    }
                }
            });

            allMatchWords = [...new Set(allMatchWords)];

            // 3. 过滤物品
            return items.filter(it => {
                const cat = catOf(it.catId);
                const loc = locOf(it.locId);

                // 基础搜索（名称、备注、条码）
                const hay = (String(it.name || '') + ' ' + String(it.note || '') + ' ' + String(it.barcode || '')).toLowerCase();
                let hasWord = false;
                for (const w of allMatchWords) {
                    if (hay.indexOf(w) >= 0) { hasWord = true; break; }
                }

                // ⭐ 核心黑科技：如果基础字段没匹配，去看分类和位置的名字是否命中！
                if (!hasWord) {
                    const catName = cat ? (cat.name.zh + ' ' + cat.name.en).toLowerCase() : '';
                    const locName = loc ? (loc.name.zh + ' ' + loc.name.en).toLowerCase() : '';

                    for (const w of allMatchWords) {
                        // 如果搜的词，匹配到了这个物品所属的“分类名”或“位置名”
                        if (catName.includes(w) || locName.includes(w)) {
                            hasWord = true;
                            break;
                        }
                    }

                    // ⭐ 更深一层：如果物品所属的是子分类，看看它的“父分类”名字有没有命中
                    if (!hasWord && cat && cat.parentId) {
                        const parentCat = catOf(cat.parentId);
                        if (parentCat) {
                            const pCatName = (parentCat.name.zh + ' ' + parentCat.name.en).toLowerCase();
                            for (const w of allMatchWords) {
                                if (pCatName.includes(w)) {
                                    hasWord = true;
                                    break;
                                }
                            }
                        }
                    }
                }

                if (!hasWord) return false;

                // 如果有颜色条件，必须匹配颜色
                for (const c of colors) {
                    const allHay = hay + (cat ? cat.name.zh : '') + (loc ? loc.name.zh : '');
                    if (allHay.indexOf(c) < 0) return false;
                }
                return true;

                root.style.setProperty('--primary', primary);
                root.style.setProperty('--primary-d', hsl2hex(h, s, dark ? Math.max(18, l - 18) : Math.max(15, l - 10)));
                root.style.setProperty('--primary-l', dark ? hsl2hex(h, Math.min(45, s), 15) : hsl2hex(h, Math.min(85, s), 94));
                root.style.setProperty('--on-primary', dark ? '#0E1012' : '#FFFFFF');
                const meta = document.querySelector('meta[name=theme-color]');

        function startOfWeek(d) {
            const r = new Date(d);
            r.setHours(0, 0, 0, 0);
            const day = r.getDay() || 7;
            r.setDate(r.getDate() - day + 1);
            return r;
        }
        function weekOptions() {
            const now = new Date();
            const regTs = S.settings.registeredAt || now.getTime();
            const reg = new Date(regTs);
            const nowWeekStart = startOfWeek(now);
            const regWeekStart = startOfWeek(reg);
            const opts = [];
            let w = new Date(nowWeekStart);
            let idx = 0;
            while (w >= regWeekStart && idx < 52) {
                opts.push({ idx, start: new Date(w), end: new Date(w.getTime() + 6 * 86400000) });
                w.setDate(w.getDate() - 7);
                idx++;
            }
            if (!opts.length) opts.push({ idx: 0, start: nowWeekStart, end: new Date(nowWeekStart.getTime() + 6 * 86400000) });
            return opts;
        }
        function weekReportDataFor(idx) {
            const opts = weekOptions();
            if (idx >= opts.length) { return { before: true }; }
            const { start, end } = opts[idx];
            const startTs = start.getTime();
            const endTs = end.getTime() + 86400000 - 1;
            const added = S.items.filter(i => (i.createdAt || 0) >= startTs && (i.createdAt || 0) <= endTs).length;

            // ⭐ 改造：拆分为已过期和临期
            const expired = S.items.filter(i => {
                const d = effectiveExpDate(i);
                if (!d) return false;
                const t = new Date(d + 'T00:00:00').getTime();
                const now = new Date(todayStr() + 'T00:00:00').getTime();
                return t >= startTs && t <= endTs && t < now; // 时间落在本周且已经过去
            }).length;

            const soon = S.items.filter(i => {
                const d = effectiveExpDate(i);
                if (!d) return false;
                const t = new Date(d + 'T00:00:00').getTime();
                const now = new Date(todayStr() + 'T00:00:00').getTime();
                return t >= startTs && t <= endTs && t >= now; // 时间落在本周且还没过去
            }).length;

            const discarded = (idx === 0) ? (S.stats.totalDiscardExpired || 0) : 0;
            const checkinCount = (idx === 0) ? (S.stats.streak || 0) : 0;
            const fromStr = (start.getMonth() + 1) + '月' + start.getDate() + '日';
            const toStr = (end.getMonth() + 1) + '月' + end.getDate() + '日';
            return { before: false, added, expired, soon, discarded, checkinCount, fromStr, toStr };
        }
        function weekLabel(idx, total) {
            if (idx === 0) return T('week_selector_this');

            });
            events.sort((a, b) => b.time - a.time);
            return events.slice(0, 8);

        function suggestLocation(itemName) {
            if (!itemName) return null;
            const name = String(itemName).trim();
            const exactAll = S.items.filter(i => (i.name || '').includes(name));
            const exactWithLoc = exactAll.filter(i => i.locId && locOf(i.locId));
            const exactNoLoc = exactAll.filter(i => !i.locId || !locOf(i.locId));
            if (exactWithLoc.length) {
                const locId = exactWithLoc[0].locId;
                return {
                    type: 'existing', locId, path: getLocFullPath(locId),
                    count: exactWithLoc.length, noLocCount: exactNoLoc.length, name
                };
            }
            if (exactNoLoc.length) {
                return { type: 'existing_noloc', count: exactNoLoc.length, name };
            }
            const m = matchShelfLife(name);
            if (m) {
                const sameCat = S.items.filter(i => i.catId === m.catId && i.locId);
                if (sameCat.length) {
                    const locId = sameCat[0].locId;
                    return { type: 'samecat', locId, path: getLocFullPath(locId), catLabel: m.label, catId: m.catId };
                }
            }
            const catId = m ? m.catId : '';
            const cat = catOf(catId);
            const locs = (() => {
                if (/c_food|c_fresh|c_food_drink|c_food_snack|c_food_season|c_food_staple|c_food_can|c_fresh_cold|c_fresh_veg|c_fresh_meat|c_fresh_dairy/.test(catId)) return ['冰箱冷藏区', '冰箱冷冻区', '吊柜', '地柜'];

            })();

                h += '<div class="sec" style="color:var(--warn)">' + T('alert_soon') + ' · ' + soonSorted.length + '</div>' + list.map(itemRow).join('');

                        '<span class="small muted">' + p + ' / ' + Math.ceil(recent.length / 10) + '</span>' +

            const arr = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);

        function filteredItems() {
            const q = UI.q.trim();
            let arr = activeItems().filter(it => {
                if (q) {
                    const matched = fuzzySearch([it], q);
                    if (!matched.length) return false;
                }
                if (UI.fcat) { if (it.catId !== UI.fcat) { const c = catOf(it.catId); if (!c || c.parentId !== UI.fcat) return false; } }
                if (UI.fst) {
                    const st = expStatus(it);
                    if (UI.fst === 'low') { if (!isLow(it)) return false; }
                    else if (UI.fst === 'idle') { if (!isIdle(it)) return false; }
                    else if (UI.fst === 'depleted') { if ((+it.qty || 0) > 0) return false; } // ⭐ 处理已用完过滤
                    else if (st !== UI.fst) return false;
                }
                if (UI.freshOnly && !isFreshItem(it)) return false;
                if (UI.focusOnly && !isImportantItem(it)) return false;
                return true;
            });
            if (UI.sort === 'name') arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'zh'));
            else if (UI.sort === 'exp') arr.sort((a, b) => String(effectiveExpDate(a) || '9999').localeCompare(String(effectiveExpDate(b) || '9999')));
            else if (UI.sort === 'price') arr.sort((a, b) => (+b.price || 0) - (+a.price || 0));
            else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            return arr;
        }

        function renderLookupResult(name) {

            const r = suggestLocation(name);
            if (!r) { el.innerHTML = T('lookup_no_match'); el.classList.add('show'); return; }
            let html = '';
            if (r.type === 'existing') {
                html = '<div class="lr-name">' + ICON.loc + ' ' + esc(r.name) + '</div>' +
                    '<div>' + T('lookup_existing', { n: r.count, name: r.name }) + ' <span class="lr-loc">' + esc(r.path) + '</span></div>';
                if (r.noLocCount > 0) {
                    html += '<div style="margin-top:6px;color:var(--warn)">' + T('lookup_noloc_warning1', { n: r.noLocCount }) + '</div>';
                }
            } else if (r.type === 'existing_noloc') {
                html = '<div class="lr-name">' + ICON.loc + ' ' + esc(r.name) + '</div>' +
                    '<div style="color:var(--warn)">' + T('lookup_noloc_warning2', { n: r.count }) + '</div>';
            } else if (r.type === 'samecat') {
                html = '<div class="lr-name">' + ICON.search + ' ' + esc(r.catLabel) + '</div>' +
                    '<div>' + T('lookup_same_cat', { cat: esc(r.catLabel) }) + ' <span class="lr-loc">' + esc(r.path) + '</span></div>';
            } else {
                html = '<div class="lr-name">' + ICON.plus + ' ' + esc(name) + '</div>' +
                    '<div>' + T('lookup_new_item', { cat: esc(r.catLabel) }) + '</div>' +
                    '<div style="margin-top:6px">' +
                    r.suggestions.map(s => '<span class="lr-loc" style="display:inline-block;background:var(--primary-l);padding:4px 12px;border-radius:14px;margin:2px 4px 2px 0">' + esc(s) + '</span>').join('') +

            const noexp = items.filter(i => !effectiveExpDate(i)).length;

            }

                '</div>';

        async function processNextBatchPhoto() {
            if (!window.__batchPhotoQueue || window.__batchPhotoQueue.length === 0) {
                window.__batchPhotoQueue = [];
                toast('🎉 所有图片处理完成！', 2500);
                return;
            }

            const f = window.__batchPhotoQueue.shift();
            toast(`正在识别第 ${window.__totalBatchCount - window.__batchPhotoQueue.length} 张，还剩 ${window.__batchPhotoQueue.length} 张...`, 3000);

            try {
                const dataUrl = await compressImage(f, 480, 0.6);
                const result = await runHybridRecognition(dataUrl);
                UI.tab = 'items'; render();
                setTimeout(() => itemFormSheet(null, result || { photo: dataUrl }), 150);
            } catch (err) {
                console.warn('批量识别失败，跳过当前', err);
                processNextBatchPhoto(); // 报错就跳过，直接看下一张

        }

        function itemDetailSheet(id) {
            const it = S.items.find(i => i.id === id);
            if (!it) return;
            const cat = catOf(it.catId), loc = locOf(it.locId);
            const st = expStatus(it);
            const total = (+it.price || 0) * (+it.qty || 0);
            const usingOpened = isUsingOpenedExpiry(it);
            const effExp = effectiveExpDate(it);
            const idle = isIdle(it) && st !== 'expired' && st !== 'soon';
            const isDepleted = (+it.qty || 0) <= 0; // ⭐

            let rows = '';
            const row = (k, v) => v ? '<div class="detail-row"><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>' : '';
            const ps = photoSrc(it.photo); if (ps) {
                rows += '<div style="margin-bottom:14px"><img src="' + ps + '" alt="" data-act="viewPhoto" style="display:block;margin:0 auto;max-width:100%;border-radius:12px;max-height:180px;object-fit:contain;cursor:pointer"></div>';
            }
            rows += row(T('cat'), cat ? nm(cat) : T('uncat'));
            rows += row(T('loc'), loc ? getLocFullPath(loc.id) : T('unloc'));
            rows += row(T('qty'), (it.qty || 0) + (it.unit ? it.unit : ''));
            if (it.price) rows += row(T('price'), '¥' + (+it.price).toFixed(2));
            if (total) rows += row(T('value'), '¥' + total.toFixed(2));
            if (it.barcode) rows += row(T('barcode'), it.barcode);
            if (it.purchaseDate) rows += row(T('purchase'), it.purchaseDate);
            if (it.prodDate) rows += row(T('prod'), it.prodDate);
            if (it.shelfLife) rows += row(T('shelf'), it.shelfLife + ' 天');
            if (it.expDate) rows += row(T('exp'), it.expDate + '（包装上）');
            if (it.opened && !isDepleted) {
                rows += row(T('opened_detail'), '✓' + (it.openedDate ? ' ' + it.openedDate : ''));
                if (it.afterOpenShelf) rows += row(T('afterOpenShelf'), it.afterOpenShelf + ' 天');
                if (usingOpened && effExp) { rows += row(T('eff_exp'), effExp); }
            } else if (it.expDate && !isDepleted) {
                rows += row(T('eff_exp'), effExp);
            }
            if (it.warrantyUntil) {
                const w = warrantyStatus(it);
                let wtxt = it.warrantyUntil;
                if (w) {
                    if (w.kind === 'expired') wtxt += '（已过保修）';
                    else wtxt += '（剩 ' + w.days + ' 天）';
                }
                rows += row(T('warranty'), wtxt);
            }
            if (it.minQty) rows += row(T('min_qty'), it.minQty);
            if (idle && !isDepleted) rows += row(T('idle'), T('idle_days', { n: idleDays(it) }));
            if (it.note) rows += row(T('note'), it.note);
            if (it.createdAt) {
                const cd = new Date(it.createdAt);
                const cstr = cd.getFullYear() + '-' + String(cd.getMonth() + 1).padStart(2, '0') + '-' + String(cd.getDate()).padStart(2, '0') + ' ' + String(cd.getHours()).padStart(2, '0') + ':' + String(cd.getMinutes()).padStart(2, '0');
                rows += row(T('added_time'), cstr + '（' + relativeTime(it.createdAt) + '）');
            }
            if (it.lastUsedAt && it.lastUsedAt !== it.createdAt) {
                const ld = new Date(it.lastUsedAt);
                const lstr = ld.getFullYear() + '-' + String(ld.getMonth() + 1).padStart(2, '0') + '-' + String(ld.getDate()).padStart(2, '0') + ' ' + String(ld.getHours()).padStart(2, '0') + ':' + String(ld.getMinutes()).padStart(2, '0');
                rows += row(T('last_used_time'), lstr + '（' + relativeTime(it.lastUsedAt) + '）');
            }

            let badge = '';
            if (isDepleted) badge = '<span class="tag idle" style="background:var(--border);color:var(--text-2)">已用完</span>';
            else if (st === 'expired') badge = '<span class="tag danger">' + T('expired') + '</span>';
            else if (st === 'soon') badge = '<span class="tag warn">' + esc(expText(it)) + '</span>';
            else if (idle) badge = '<span class="tag idle">闲置 ' + idleDays(it) + ' 天</span>';

            let h = '<div class="sheet-hd"><h3>' + esc(it.name) + '</h3></div>';
            if (badge) h += '<div style="margin-bottom:12px">' + badge + '</div>';
            if (st === 'expired' && !isDepleted) {
                h += '<div class="field-bar" style="margin-bottom:12px">' + ICON.leaf + '<div class="txt">' + T('field_clean_tip') + '</div></div>';
            }
            const w = warrantyStatus(it);
            if (w && (w.kind === 'soon' || w.kind === 'expired')) {
                const wtext = w.kind === 'expired' ? T('warranty_expired_days', { n: -w.days }) : T('warranty_days', { n: w.days });
                h += '<div class="warranty-bar">' + ICON.warranty + '<div class="txt">' + esc(wtext) + '</div></div>';
            }
            h += '<div class="card" style="margin-bottom:0">' + rows + '</div>';

            if (st === 'expired' && !isDepleted) {

        let scanStream = null, scanRAF = null, scanDetector = null, scanning = false;
        let zxingReader = null, scanCanvas = null, scanCtx = null, lastDecodeTime = 0;
        async function startScan() {
            if (scanning) return;
            if (UI.tab !== 'scan') return;
            const video = $('#scanVideo');
            const statusEl = $('#scanStatus');
            const frameEl = $('#scanFrame');
            const tipEl = $('#scanTip');
            if (!video) return;
            const isSecure = window.isSecureContext === true;
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                if (statusEl) statusEl.innerHTML = '<span style="color:var(--warn);font-weight:600">' + T('cam_unsupported') + '</span>';
                if (tipEl) tipEl.textContent = T('cam_unsupported');
                return;
            }
            if (!isSecure) {
                if (statusEl) statusEl.innerHTML = '<span style="color:var(--warn);font-weight:600">' + T('cam_need_https') + '</span>';
                if (tipEl) tipEl.textContent = '';
                if (frameEl) frameEl.style.display = 'none';
                return;
            }
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
            } catch (e) {
                if (statusEl) statusEl.textContent = T('cam_denied');
                if (tipEl) tipEl.textContent = '';
                return;
            }
            video.srcObject = scanStream;
            try { await video.play(); } catch (e) { }
            await new Promise(res => {
                if (video.readyState >= 2 && video.videoWidth > 0) return res();
                const t = setTimeout(res, 2000);
                const done = () => { clearTimeout(t); res(); };
                video.onloadedmetadata = done;
                video.oncanplay = done;
            });
            if (frameEl) frameEl.style.display = 'block';
            scanning = true;
            if (statusEl) statusEl.textContent = T('scanning');
            if (tipEl) tipEl.textContent = T('scan_hint');
            scanDetector = null;
            if (zxingReader) { try { zxingReader.reset(); } catch (e) { } zxingReader = null; }
            if ('BarcodeDetector' in window) {
                try {
                    const fmts = await BarcodeDetector.getSupportedFormats();
                    const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'codabar'];
                    const use = want.filter(f => fmts.indexOf(f) >= 0);
                    scanDetector = use.length ? new BarcodeDetector({ formats: use }) : new BarcodeDetector();
                } catch (e) { scanDetector = null; }
            }
            if (!scanDetector && typeof ZXing !== 'undefined') {
                try {
                    const hints = new Map();
                    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
                        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
                        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
                        ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODABAR
                    ]);
                    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                    zxingReader = new ZXing.BrowserMultiFormatReader(hints);
                } catch (e) { zxingReader = null; }
            }
            if (!scanDetector && !zxingReader) {
                if (statusEl) statusEl.textContent = T('scanner_unavailable');
                return;
            }
            scanCanvas = document.createElement('canvas');
            scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
            lastDecodeTime = 0;
            const tick = async () => {
                if (!scanning) return;
                if (!video.isConnected) { scanning = false; return; }
                if (video.readyState < 2 || !video.videoWidth) { scanRAF = requestAnimationFrame(tick); return; }
                if (scanDetector) {
                    try {
                        const codes = await scanDetector.detect(video);
                        if (codes && codes.length && codes[0].rawValue) { onScanned(String(codes[0].rawValue)); return; }
                    } catch (e) { }
                }
                if (zxingReader) {
                    const now = performance.now();
                    if (now - lastDecodeTime > 200) {
                        lastDecodeTime = now;
                        if (scanCanvas.width !== video.videoWidth) {
                            scanCanvas.width = video.videoWidth;
                            scanCanvas.height = video.videoHeight;
                        }
                        try {
                            scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
                            const r = zxingReader.decodeFromCanvas(scanCanvas);
                            if (r) { const txt = r.getText(); if (txt) { onScanned(txt); return; } }
                        } catch (e) { }
                    }
                }
                scanRAF = requestAnimationFrame(tick);
            };
            tick();
        }
        function stopScan() {
            scanning = false;
            if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
            if (zxingReader) { try { zxingReader.reset(); } catch (e) { } zxingReader = null; }
            if (scanStream) { scanStream.getTracks().forEach(tr => tr.stop()); scanStream = null; }
            const v = $('#scanVideo'); if (v) v.srcObject = null;
            scanCanvas = null; scanCtx = null; lastDecodeTime = 0;
        }
        function detectBarcodeInfo(code) {
            const digits = String(code).replace(/\D/g, '');
            const info = { type: '', region: '' };
            if (digits.length === 13) info.type = 'EAN-13';
            else if (digits.length === 12) info.type = 'UPC-A';
            else if (digits.length === 8) info.type = 'EAN-8';
            else if (digits.length > 0) info.type = T('lookup_digit_barcode');
            else info.type = T('lookup_other_barcode');
            if (digits.length >= 3) {
                const p = parseInt(digits.slice(0, 3), 10);
                if (p >= 690 && p <= 699) info.region = '中国大陆';
                else if (p >= 0 && p <= 139) info.region = '美国/加拿大';
                else if (p >= 300 && p <= 379) info.region = '法国';
                else if (p >= 400 && p <= 440) info.region = '德国';
                else if (p >= 450 && p <= 459) info.region = '日本';
                else if (p === 471) info.region = '中国台湾';
                else if (p === 489) info.region = '中国香港';
                else if (p === 958) info.region = '中国澳门';
                else if (p === 880) info.region = '韩国';
                else if (p === 93) info.region = '澳大利亚';
                else if (p === 94) info.region = '新西兰';
                else if (p === 955) info.region = '马来西亚';
            }
            return info;
        }
        async function lookupNetwork(code) {
            const sources = [
                { name: 'Open Food Facts', url: 'https://world.openfoodfacts.org/api/v2/product/' },
                { name: 'Open Beauty Facts', url: 'https://world.openbeautyfacts.org/api/v2/product/' },
                { name: 'Open Products Facts', url: 'https://world.openproductsfacts.org/api/v2/product/' }
            ];
            const fields = 'product_name,product_name_zh,generic_name,brands,categories_tags,quantity';
            for (const src of sources) {
                try {
                    const ctrl = new AbortController();
                    const tm = setTimeout(() => ctrl.abort(), 4000);
                    const url = src.url + encodeURIComponent(code) + '.json?fields=' + fields;
                    const r = await fetch(url, { signal: ctrl.signal });
                    clearTimeout(tm);
                    if (!r.ok) continue;
                    const j = await r.json();
                    if (j && j.status === 1 && j.product) {
                        const p = j.product;
                        const name = String(p.product_name_zh || p.product_name || p.generic_name || '').trim();
                        const brand = String(p.brands || '').split(',')[0].trim();
                        const qty = String(p.quantity || '').trim();
                        const tags = (p.categories_tags || []).join(' ').toLowerCase();
                        let catId = '';
                        if (/snack|biscuit|chocolate|candy|chip|crisp/.test(tags)) catId = 'c_food_snack';
                        else if (/beverage|drink|water|juice|soda|coffee|tea/.test(tags)) catId = 'c_food_drink';
                        else if (/condiment|sauce|spice|oil|vinegar/.test(tags)) catId = 'c_food_season';
                        else if (/dairy|milk|yogurt|cheese/.test(tags)) catId = 'c_fresh_dairy';
                        else if (/frozen/.test(tags)) catId = 'c_fresh_cold';
                        else if (/canned/.test(tags)) catId = 'c_food_can';
                        else if (/cosmetic|beauty|shampoo|skin|lotion/.test(tags)) catId = 'c_beauty_skin';
                        else if (/food/.test(tags)) catId = 'c_food';
                        if (name || brand) {
                            const notes = ['【联网查询】', '条码：' + code];
                            if (brand) notes.push('品牌：' + brand);
                            if (qty) notes.push('规格：' + qty);
                            notes.push('来源：' + src.name);
                            return { name, brand, qty, catId, note: notes.join('\n') };
                        }
                    }
                } catch (e) { }
            }
            return null;

        function compressImage(file, maxW, quality) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = fr.result;
                };
                fr.onerror = reject;
                fr.readAsDataURL(file);
            });
        }

        async function recognizeImageText(dataUrl) {
            if (typeof Tesseract === 'undefined') throw new Error('OCR 库未加载');
            toast(T('ocr_image_processing'), 5000);

            // ---- 图像预处理：灰度化 + 对比度增强 ----
            const img = new Image();
            img.src = dataUrl;
            await new Promise(resolve => img.onload = resolve);
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                // 灰度公式
                const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                // 对比度增强（阈值化），让黑字更黑，背景更白
                const val = gray > 130 ? 255 : 0;
                data[i] = data[i + 1] = data[i + 2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
            const processedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            // ----------------------------------------

            if (!_ocrWorker) {
                toast(T('ocr_loading_model'), 8000);
                _ocrWorker = await Tesseract.createWorker('chi_sim', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            toast(T('toast_ocr_progress', { p: Math.round((m.progress || 0) * 100) }), 1200);
                        }
                    }
                });
            }
            // 识别处理后的图片
            const r = await _ocrWorker.recognize(processedDataUrl);
            return (r.data && r.data.text) || '';
        }
        function _parseOcrDate(str) {
            const m = String(str || '').match(/(\d{4})[\-\.年\/](\d{1,2})[\-\.月\/](\d{1,2})/);
            if (!m) return '';
            return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
        }
        function parseOcrText(text) {
            if (!text) return {};
            const prefill = {};
            const flat = text.replace(/\s+/g, '');

            // 1. 生产日期
            const prodM = flat.match(/生产日期[：:\s]*([\d\-\.年月日\/]+)/i) || flat.match(/(20\d{2})[\.\-年](\d{1,2})[\.\-月](\d{1,2})/);
            if (prodM) prefill.prodDate = _parseOcrDate(prodM[1] || prodM[0]);

            // 2. 保质期
            const shelfM = flat.match(/保质期[：:\s]*(\d+)\s*(天|日|个月|月|年)/i);
            if (shelfM) {
                const n = parseInt(shelfM[1], 10);
                const u = shelfM[2];
                prefill.shelfLife = u === '年' ? n * 365 : /个月|月/.test(u) ? n * 30 : n;
            }

            // 3. 产品名称提取（宁可多字，不可少字）
            let extractedName = '';
            const nameM = text.match(/(?:产品名称|品名|名称)[：:\s]*([^\n]+)/);
            if (nameM) {
                extractedName = nameM[1].trim();
                extractedName = extractedName.replace(/^[^\u4e00-\u9fa5a-zA-Z0-9]+|[^\u4e00-\u9fa5a-zA-Z0-9]+$/g, '');
            }

            if (extractedName) {
                prefill.name = extractedName;
            } else {
                const lines = text.split('\n').map(s => s.trim()).filter(s => s.length >= 2 && s.length <= 30);
                let possibleNames = [];
                for (const line of lines) {
                    if (/^(生产日期|保质期|净含量|地址|电话|厂家|执行标准|保存方法|注意事项|成分|配料|营养|产品标准|卫生标准|主要原料|营养成分|成分表|配料表|能量|蛋白质|脂肪|碳水化合物|钠|净重|规格|条码|编号|合格|检验|使用说明|警告|温馨提示|保质期至|过敏原|由此|剪开|撕开|撕口|半袋|半包|开封|打开|请勿|注意|提示|方法|建议|存放|储藏|开启|拉开|沿着|本品|此面|向上|轻拿|轻放|小心|防潮|防晒|避光|原色|自然开|开口|免洗|原味|经典|精选|优质|新鲜|特产|【|\(|\)|（|）)/.test(line)) continue;
                    if (/^\d/.test(line)) continue;
                    possibleNames.push(line);
                    if (possibleNames.length >= 2) break; // 最多抓两行
                }
                if (possibleNames.length > 0) {
                    if (possibleNames[0].length <= 5 && possibleNames.length > 1) {
                        // 如果第一行很短（比如只有品牌），就拼上第二行（如：统一 + 阿萨姆奶茶）
                        prefill.name = possibleNames[0] + possibleNames[1];
                    } else {
                        prefill.name = possibleNames[0];
                    }
                }
            }

            // 4. 净含量
            const netM = flat.match(/(?:净含量|净重|规格|含量)[：:\s]*(\d+(?:\.\d+)?)\s*(ml|mL|毫升|g|克|kg|千克|L|升|抽|片|卷|包)/i);
            if (netM) {
                const num = parseFloat(netM[1]);
                const raw = netM[2].toLowerCase();
                if (/抽/.test(raw)) { prefill.qty = num; prefill.unit = '抽'; }
                else if (/包/.test(raw)) { prefill.qty = num; prefill.unit = '包'; }
                else if (/ml|毫升/.test(raw)) { prefill.qty = num; prefill.unit = '毫升'; }
                else if (/kg|千克/.test(raw)) { prefill.qty = num * 1000; prefill.unit = '克'; }
                else if (/^g$|克/.test(raw)) { prefill.qty = num; prefill.unit = '克'; }
                else if (/^l$|升/.test(raw)) { prefill.unit = '升'; prefill.qty = num; }
            }

            // 5. 算过期日
            if (prefill.prodDate && prefill.shelfLife) {
                prefill.expDate = addDays(prefill.prodDate, prefill.shelfLife);
            }

            // 6. 分类兜底
            if (prefill.name && !prefill.catId) {
                const m = matchShelfLife(prefill.name);
                if (m) prefill.catId = m.catId;
            }

            // 7. 单位兜底
            if (!prefill.unit && prefill.name) prefill.unit = guessUnit(prefill.name);

            return prefill;
        }

        let _baiduTokenCache = { token: '', expireAt: 0 };

        async function getBaiduToken() {
            const st = S.settings;
            if (!st.baiduApiKey || !st.baiduSecretKey) throw new Error('未配置百度 API Key');
            if (_baiduTokenCache.token && Date.now() < _baiduTokenCache.expireAt) {
                return _baiduTokenCache.token;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                // ⚠️ 换成 localhost
                const res = await fetch(`http://localhost:8080/oauth/2.0/token?grant_type=client_credentials&client_id=${st.baiduApiKey}&client_secret=${st.baiduSecretKey}`, {
                    method: 'POST',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await res.json();
                if (!data.access_token) throw new Error(data.error_description || '获取 Token 失败');

                _baiduTokenCache = {
                    token: data.access_token,
                    expireAt: Date.now() + (Math.max(60, data.expires_in - 3600)) * 1000
                };
                return data.access_token;
            } catch (e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') throw new Error('获取百度 Token 超时(网络卡顿)');
                throw e;
            }
        }

        async function callLlmVision(dataUrl) {
            const st = S.settings;
            if (!st.llmApiKey) throw new Error('未配置大模型 Key');
            const base64Image = dataUrl.split(',')[1];

            const url = 'http://localhost:8080/hunyuan/chat/completions';

            // ⭐ 核心修改：重新设计 Prompt，加入品牌和药品规则
            const prompt = `请仔细观察这张照片，识别其中的物品名称，并遵循以下规则：
1. 【药品类】：请提取完整的药品名称（品牌/通用名+剂型）和主要功效。格式示例："芬必得布洛芬缓释胶囊 退烧止痛"、"西瓜霜清咽含片 口腔溃疡"。

            const body = {
                model: "hy-vision-2.0-instruct",
                messages: [{
                    role: "user",
                    content: [
                        {
                            type: "image_url",
                            image_url: { url: `data:image/jpeg;base64,${base64Image}` }
                        },
                        { type: "text", text: prompt }

                temperature: 0.1 // 保持低温度，让模型严谨输出，不要瞎编
            };

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${st.llmApiKey}`
            };

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

                const res = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!res.ok) {

                    throw new Error(`HTTP ${res.status}: ${errText.slice(0, 200)}`);

                answer = answer.replace(/[。！？，、“”"'；：]/g, '');

                return answer;

            } catch (e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') throw new Error('腾讯混元请求超时');
                throw e;
            }
        }
