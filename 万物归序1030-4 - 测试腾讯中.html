        /* ★★★ 拖拽（修复版） ★★★ */
        let suppressClick = false;
        let dragState = null;

        function beginDrag(itemEl, e, isTouch) {
            const itemId = itemEl.dataset.id;
            const startX = e.clientX, startY = e.clientY;
            const pointerId = e.pointerId;
            const startRect = itemEl.getBoundingClientRect();
            let started = false;
            let ghost = null;
            let currentDrop = null;
            let holdTimer = null;
            let cancelled = false;

            const preventScroll = (ev) => { if (started && ev.cancelable) ev.preventDefault(); };

            const startDrag = () => {
                if (started) return;
                started = true;
                if (navigator.vibrate) { try { navigator.vibrate(35); } catch (e) { } }
                ghost = itemEl.cloneNode(true);
                ghost.classList.add('drag-ghost');
                ghost.style.left = startRect.left + 'px';
                ghost.style.top = startRect.top + 'px';
                ghost.style.width = startRect.width + 'px';
                ghost.style.height = startRect.height + 'px';
                ghost.style.pointerEvents = 'none';
                document.body.appendChild(ghost);
                itemEl.classList.add('dragging');
            };

            const cleanup = () => {
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                document.removeEventListener('pointercancel', onCancel);
                document.removeEventListener('touchmove', preventScroll, { passive: false });
                if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
                if (currentDrop) currentDrop.classList.remove('drop-hover');
                itemEl.classList.remove('dragging');
                itemEl.style.touchAction = '';
                itemEl.style.webkitUserSelect = '';
                itemEl.style.userSelect = '';
                dragState = null;
                ghost = null; currentDrop = null;
            };

            const onMove = (ev) => {
                if (ev.pointerId !== pointerId) return;
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                if (!started) {
                    if (!isTouch) {
                        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) startDrag();
                        else return;
                    } else {
                        if (Math.abs(dx) > 12 || Math.abs(dy) > 12) { cancelled = true; cleanup(); }
                        return;
                    }
                }
                if (ev.cancelable) ev.preventDefault();
                if (ghost) {
                    ghost.style.left = (startRect.left + dx) + 'px';
                    ghost.style.top = (startRect.top + dy) + 'px';
                }
                const el = document.elementFromPoint(ev.clientX, ev.clientY);
                const dropEl = el && el.closest ? el.closest('[data-drop-loc]') : null;
                if (dropEl !== currentDrop) {
                    if (currentDrop) currentDrop.classList.remove('drop-hover');
                    if (dropEl) dropEl.classList.add('drop-hover');
                    currentDrop = dropEl;
                }
            };

            const onUp = (ev) => {
                if (ev.pointerId !== pointerId) return;
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                if (started && !cancelled) {
                    suppressClick = true;
                    setTimeout(() => { suppressClick = false; }, 500);
                    const el = document.elementFromPoint(ev.clientX, ev.clientY);
                    const dropEl = el && el.closest ? el.closest('[data-drop-loc]') : null;
                    if (dropEl) {
                        const newLocId = dropEl.getAttribute('data-drop-loc') || '';
                        const it = S.items.find(i => i.id === itemId);
                        if (it && it.locId !== newLocId) {
                            it.locId = newLocId;
                            it.lastUsedAt = Date.now();
                            it.lastPutAt = Date.now();
                            S.stats.totalDragMoved = (S.stats.totalDragMoved || 0) + 1;
                            save(); markRecorded();
                            const name = newLocId ? getLocFullPath(newLocId) : T('unloc');
                            toast(T('drag_moved', { n: name }), 2200);
                            if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) { } }
                            checkAchievements();
                            cleanup();
                            const list = document.getElementById('zonesList');
                            if (list) list.innerHTML = renderZonesList();
                            else render({ noScroll: true });
                            return;
                        }
                    }
                }
                cleanup();
            };
            const onCancel = (ev) => { if (ev.pointerId !== pointerId) return; cancelled = true; cleanup(); };

            document.addEventListener('touchmove', preventScroll, { passive: false });
            document.addEventListener('pointermove', onMove, { passive: false });
            document.addEventListener('pointerup', onUp);
            document.addEventListener('pointercancel', onCancel);

            if (isTouch) {
                holdTimer = setTimeout(() => { if (cancelled) return; startDrag(); }, 350);
            }
        }

        document.addEventListener('pointerdown', e => {
            if (UI.tab !== 'zones' || UI.organizeMode) return;
            if (e.button !== undefined && e.button !== 0) return;
            const itemEl = e.target.closest('.item[data-act="openItem"]');
            if (!itemEl) return;

        function parseCSV(text) {
            const rows = [];
            let cur = [], field = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQ) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQ = false;
                    } else field += c;
                } else {
                    if (c === '"') inQ = true;
                    else if (c === ',') { cur.push(field); field = ''; }
                    else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
                    else if (c === '\r') { }
                    else field += c;
                }
            }
            if (field || cur.length) { cur.push(field); rows.push(cur); }
            return rows.filter(r => r.some(f => f !== ''));
        }
        function importCSV(text) {
            const rows = parseCSV(text);
            if (rows.length < 2) throw new Error('bad csv');
            const headers = rows[0];
            const idx = {};
            headers.forEach((h, i) => idx[h.trim()] = i);
            const getCol = (row, name) => { const i = idx[name]; return i !== undefined ? (row[i] || '') : ''; };
            const newItems = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                const name = getCol(r, '名称');
                if (!name) continue;
                const catName = getCol(r, '分类');
                const cat = S.categories.find(c => nm(c) === catName);
                const locPath = getCol(r, '存放位置');
                let locId = '';
                if (locPath) {
                    const parts = locPath.split('→').map(s => s.trim());
                    const tree = locTree();
                    for (const top of tree) {
                        if (nm(top) === parts[0]) {
                            if (parts[1]) { const sub = top.children.find(c => nm(c) === parts[1]); if (sub) locId = sub.id; }
                            else locId = top.id;
                            break;
                        }
                    }
                }
                newItems.push({
                    id: uid('i_'), createdAt: Date.now(), lastUsedAt: Date.now(),
                    name, catId: cat ? cat.id : '', locId,
                    qty: parseFloat(getCol(r, '数量')) || 1,
                    unit: getCol(r, '单位'),
                    price: parseFloat(getCol(r, '单价')) || 0,
                    purchaseDate: getCol(r, '购买日期'),
                    prodDate: getCol(r, '生产日期'),
                    expDate: getCol(r, '过期日期'),
                    opened: getCol(r, '开封') === '是',
                    openedDate: getCol(r, '开封日期'),
                    afterOpenShelf: parseInt(getCol(r, '开封后保质期(天)')) || 0,
                    warrantyUntil: getCol(r, '保修截止日'),
                    minQty: parseFloat(getCol(r, '低库存阈值')) || 0,
                    note: getCol(r, '备注'),
                    barcode: getCol(r, '条码')
                });
            }
            return newItems;
        }

                        () => {
                            const target = dupes[0];
                            target.qty = (+target.qty || 0) + qtyVal;
                            target.lastUsedAt = Date.now();
                            target.lastPutAt = Date.now();
                            if (data.price && !target.price) target.price = data.price;
                            if (data.expDate && !target.expDate) target.expDate = data.expDate;
                            markRecorded(); save(); closeSheet(); toast(T('merged')); checkAchievements(); render({ noScroll: true });
                        },
                        {
                            okText: T('merge_qty'), cancelText: '新建一个', onCancel: () => {
                                doAddItem(data);
                            }
                        }
                    );
                    return;
                }
            }

            if (id) {
                const it = S.items.find(i => i.id === id);
                if (it) Object.assign(it, data, { updatedAt: Date.now(), lastUsedAt: Date.now() });
            } else {
                doAddItem(data);
                return;
            }
            if (data.barcode) {
                if (!S.barcodeCache) S.barcodeCache = {};
                S.barcodeCache[data.barcode] = { name: data.name, catId: data.catId, unit: data.unit, price: data.price, ts: Date.now() };
            }
            window.__currentPhoto = '';
            markRecorded();
            save(); closeSheet(); toast(T('saved')); checkAchievements(); render({ noScroll: true });
        }
        function doAddItem(data) {
            S.items.push(Object.assign({ id: uid('i_'), createdAt: Date.now(), lastUsedAt: Date.now(), lastTakenAt: 0, lastPutAt: 0 }, data));
            S.stats.totalAdded = (S.stats.totalAdded || 0) + 1;
            if ((+data.price || 0) >= 1000) S.stats.luxuryAdded = 1;
            if (data.name && data.barcode && (+data.price > 0) && data.expDate && data.catId && data.locId && data.unit) S.stats.perfectItem = 1;
            const hr = new Date().getHours();
            if (hr >= 0 && hr < 5) S.stats.nightAdded = 1;
            const topCats = S.categories.filter(c => !c.parentId && c.id !== 'c_other').map(c => c.id);
            const usedTops = new Set();
            activeItems().forEach(it => {
                if (!it.catId) return;
                let c = catOf(it.catId);
                while (c && c.parentId) c = catOf(c.parentId);
                if (c && topCats.indexOf(c.id) >= 0) usedTops.add(c.id);
            });
            if (usedTops.size >= topCats.length) S.stats.allCatsUsed = 1;
            if (data.barcode) {
                if (!S.barcodeCache) S.barcodeCache = {};
                S.barcodeCache[data.barcode] = { name: data.name, catId: data.catId, unit: data.unit, price: data.price, ts: Date.now() };
            }
            window.__currentPhoto = '';
            markRecorded();
            save(); closeSheet(); toast(T('saved')); checkAchievements(); render({ noScroll: true });
        }
        window.addEventListener('hashchange', () => { render(); });
        load();
        applyTheme();
        render();
        PhotoDB.init().then(async () => {
            await migratePhotosToIDB();
            render({ noScroll: true });
        });
        window.addEventListener('load', () => {
            setTimeout(() => {
                const s = document.getElementById('splash');
                if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 450); }
            }, 900);
            if (!S.settings.onboarded && !isShareMode()) {
                setTimeout(() => showOnboard(), 1100);
            }
        });
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (isShareMode()) return;
            const tag = (e.target.tagName || '').toLowerCase();
            const isInput = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
            // / 聚焦搜索
            if (e.key === '/' && !isInput && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (UI.tab === 'items') { const q = document.getElementById('itemQ'); if (q) { q.focus(); q.select(); } }
                else if (UI.tab === 'zones') { const q = document.getElementById('zoneQ'); if (q) { q.focus(); q.select(); } }
                else if (UI.tab === 'home') { UI.tab = 'items'; render(); setTimeout(() => { const q = document.getElementById('itemQ'); if (q) { q.focus(); q.select(); } }, 50); }
                return;
            }
            // Esc 关闭弹窗
            if (e.key === 'Escape') {
                const sheet = document.querySelector('.sheet-mask.show');
                if (sheet) { closeSheet(); return; }
                if (UI.organizeMode) { UI.organizeMode = false; UI.selectedIds.clear(); render({ noScroll: true }); return; }
                return;
            }
            // Ctrl+Enter 保存（表单弹窗打开时）
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const saveBtn = document.querySelector('[data-act="saveItem"]');
                if (saveBtn) { saveBtn.click(); return; }
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopScan();
            else if (UI.tab === 'scan') startScan();
        });
    </script>
</body>
</html>
